# Grepmind Near — Nginx reverse proxy
# Forwards API traffic to the Go backend.
# Local dev: add `api.near.grepmind.com 172.18.160.150` to your hosts file
# (or to the Android emulator's /etc/hosts via adb with root).

server {
    listen 80;
    server_name api.near.grepmind.com _;

    # Public media assets from MinIO object storage
    location /media/ {
        proxy_pass http://minio:9000/grepmind-near/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /healthz {
        proxy_pass http://api:8080;
    }
}
