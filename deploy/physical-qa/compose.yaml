name: abashyaka-physical-qa
services:
  postgres:
    image: ${QA_POSTGRES_IMAGE:?required}
    environment:
      POSTGRES_DB: physical_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${QA_DB_PASSWORD:?required}
    tmpfs:
      - /var/lib/postgresql/data:rw,size=1024m
    networks: [qa]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, physical_qa]
      interval: 5s
      retries: 30
    restart: 'no'
  minio:
    image: ${QA_MINIO_IMAGE:?required}
    command: [server, /data, '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: qa-storage-admin
      MINIO_ROOT_PASSWORD: ${QA_MINIO_PASSWORD:?required}
    tmpfs:
      - /data:rw,size=256m
    networks: [qa]
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      retries: 30
    restart: 'no'
  otp-inbox:
    image: abashyaka-physical-qa-otp:8d5eb0f
    env_file:
      - /opt/abashyaka/secrets/physical-qa/scope.env
      - /opt/abashyaka/secrets/physical-qa/writer.env
      - /opt/abashyaka/secrets/physical-qa/runner.env
    environment:
      APP_ENV: qa
      QA_OTP_READER_ENABLED: 'true'
      QA_OTP_INBOX_DIR: /run/qa-otp
    tmpfs:
      - /run/qa-otp:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=0,gid=0
    ports:
      - '127.0.0.1:18085:8090'
    networks: [qa, control]
    restart: 'no'
  api:
    image: sha256:b80c541276f7c67400edd20d16fe2b3e925f30b2aabd91d1bcb8cee0cf8e956e
    env_file:
      - /opt/abashyaka/secrets/physical-qa/scope.env
      - /opt/abashyaka/secrets/physical-qa/writer.env
    environment:
      APP_ENV: qa
      OTP_PROVIDER: qa_http
      QA_OTP_DELIVERY_ENABLED: 'true'
      QA_OTP_DELIVERY_URL: http://otp-inbox:8090
      DB_HOST: postgres
      DB_NAME: physical_qa
      DB_USER: physical_qa_api
      DB_PASSWORD: ${QA_DB_APP_PASSWORD:?required}
      JWT_SECRET: ${QA_JWT_SECRET:?required}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: qa-storage-admin
      S3_SECRET_KEY: ${QA_MINIO_PASSWORD:?required}
      S3_BUCKET: physical-qa
      S3_PRIVATE_BUCKET: physical-qa-private
      RIDER_DISPATCH_ENABLED: 'false'
      RIDER_EARNINGS_ALLOW_SYNTHETIC: 'false'
      RIDER_EARNINGS_POSTING_ENABLED: 'false'
      SANDBOX_COD_ENABLED: 'false'
      PAYMENT_SANDBOX_ENABLED: 'false'
    ports:
      - '127.0.0.1:18083:8080'
    networks: [qa, control]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: 'no'
  gateway:
    profiles: [warp]
    image: nginx@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      control: {}
      edge:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      retries: 10
    restart: 'no'
networks:
  qa:
    internal: true
  control: {}
  edge:
    external: true
    name: abashyaka_edge
