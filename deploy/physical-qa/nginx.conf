# Private WARP-only QA gateway. No host ports or OTP-reader routes.
server {
    listen 8080;
    server_name _;
    location = /healthz { proxy_pass http://api:8080; }
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / { return 404; }
}
