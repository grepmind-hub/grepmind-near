# Internal origin routing only. Compose publishes no host ports.
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
client_max_body_size 10m;
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name api.abashyaka.com;
    # Pre-login device registration is enabled for staging QA.
    # The backend enforces APP_ENV=qa before accepting registrations.
    location = /healthz {
        proxy_pass http://api:8080;
        add_header Cache-Control "no-store" always;
    }
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name admin.abashyaka.com;
    location = / { return 302 /admin/; }
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://admin:3000; }
}
# Merchant web is not part of the active deployment.
# Merchant functionality is served exclusively through the Android application.
# Mobile Merchant API endpoints remain available on the API hostname above.
