server {
    listen 80;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://grepmind-phase2e-api-qa:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://grepmind-phase2e-qa-minio:9000/grepmind-phase2e-qa/;
        proxy_set_header Host $host;
    }

    location /merchant/ {
        proxy_pass http://grepmind-phase2e-qa-merchant-web:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://grepmind-phase2e-api-qa:8080/healthz;
    }
}
