        '200': {description: Availability lease renewed}
        '409': {description: Lease expired; rider must explicitly go online again}
  /rider/offers:
    get:
      summary: List active dispatch offers for the authenticated rider
      tags: [rider]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Active offers with fulfillment items, pickup business, destination locality, and expiry}
  /rider/offers/{offerId}:
    get:
      summary: Load an offer only for its assigned rider
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: offerId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Rider-scoped offer}
        '404': {description: Offer not found for this rider}
  /rider/offers/{offerId}/accept:
    post:
      summary: Accept an active rider offer atomically
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: offerId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Assignment accepted, audit and status events recorded}
        '404': {description: Offer not found for this rider}
        '409': {description: Offer expired, closed, or rider no longer eligible}
  /rider/offers/{offerId}/decline:
    post:
      summary: Decline an active offer and advance sequential dispatch
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: offerId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {reason: {type: string, maxLength: 500}}}
      responses:
        '200': {description: Offer declined and next eligible rider considered}
        '404': {description: Offer not found for this rider}
  /rider/assignments/active:
    get:
      summary: Read the authenticated rider's current assignment, if any
      tags: [rider]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Active assigned job, partner and destination details, item snapshot, delivery state and synthetic QA COD amount/state; no GPS or ETA}
  /rider/cash-accountability:
    get:
      summary: Read authenticated rider synthetic COD liability summary
      description: Liability is derived from synthetic collection records less finance-verified remittances and is separate from rider earnings.
      tags: [rider]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Synthetic QA collected, remitted, pending and outstanding amounts}
        '503': {description: Synthetic COD disabled}
  /rider/cash-remittances:
    get:
      summary: List the authenticated rider's synthetic remittance submissions
      tags: [rider]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Rider-owned remittance history}
    post:
      summary: Submit synthetic remittance claim
      description: Submission does not reduce rider liability; only independent finance verification posts the balanced journal.
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, submission_reference]
              properties:
                amount_minor: {type: integer, minimum: 1}
                submission_reference: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201': {description: Synthetic remittance submitted for review}
        '200': {description: Idempotent replay of the same rider submission}
        '409': {description: Amount exceeds unverified rider liability or idempotency conflict}
        '503': {description: Synthetic COD disabled}
  /admin/cod/collections:
    get:
      summary: List Admin-visible synthetic COD collections
      tags: [admin-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Collection evidence with journal reference}
        '403': {description: Active Platform Admin access required}
  /admin/cod/remittances:
    get:
      summary: List Admin-visible remittance submissions
      tags: [admin-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Remittances pending or completed finance review. Each row includes sandbox_verified, which is true when its linked journal records a verified, posted sandbox COD remittance.'}
        '403': {description: Active Platform Admin access required}
  /admin/cod/remittances/{remittanceId}/review:
    post:
      summary: Verify, dispute or reject a synthetic remittance
      tags: [admin-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: remittanceId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [verify, dispute, reject]}
                reason: {type: string, minLength: 5, maxLength: 300}
      responses:
        '200': {description: Finance decision recorded; verification creates one balanced synthetic journal}
        '403': {description: finance.post permission required or self-review denied}
        '409': {description: Invalid state or remittance exceeds collected liability}
  /admin/cod/audit:
    get:
      summary: Read append-only COD finance audit history
      tags: [admin-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: COD audit history}
        '403': {description: Active Platform Admin access required}
  /admin/cod/reconcile:
    get:
      summary: Detect COD ledger and delivery inconsistencies
      description: Detection only; never repairs or invents financial events.
      tags: [admin-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Reconciliation findings and automatic_repairs false}
        '403': {description: Active Platform Admin access required}
  /admin/delivery-jobs:
    get:
      summary: Read the dispatch board and refresh expired offers
      description: Returns recent delivery jobs with immutable order, customer, partner, locality, fulfillment, dispatch, and rider identifiers for safe Admin review.
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Recent delivery jobs and rider assignment state}
        '503': {description: Dispatch disabled}
  /admin/delivery-jobs/{jobId}/execution-events:
    get:
      summary: Read Admin-authorized delivery execution history
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Delivery milestones without verification secrets}
        '403': {description: Admin access required}
        '404': {description: Delivery job not found}
  /admin/delivery-jobs/{jobId}/eligible-riders:
    get:
      summary: List approved, online riders eligible for a job's locality
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Eligible riders with no active offer or assignment}
  /admin/delivery-jobs/{jobId}/retry:
    post:
      summary: Retry an exhausted dispatch run with an audited reason
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '200': {description: New sequential dispatch run started}
        '409': {description: Job state does not allow retry}
  /admin/delivery-jobs/{jobId}/assign:
    post:
      summary: Assign an eligible online rider with a required audit reason
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [rider_user_id, reason], properties: {rider_user_id: {type: string, format: uuid}, reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '200': {description: Admin assignment and immutable audit events recorded}
        '409': {description: Job/rider state conflict}
  /admin/delivery-recovery-cases:
    get:
      summary: List open, investigating, action-pending and escalated delivery recovery cases
      description: Requires primary superadmin or an Admin with delivery_operator permission. Response omits customer contact, rider KYC and precise location.
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Recovery queue ordered by oldest open case}
        '403': {description: Delivery operator permission required}
        '503': {description: Dispatch disabled}
  /admin/delivery-operations/alerts:
    get:
      summary: List persisted delivery operations requiring review
      description: Requires primary superadmin or an active Admin with delivery_operator permission. Read-only; does not resolve alerts or mutate assignments, custody, inventory, or earnings. Omits customer contact, OTP, rider KYC, and precise location.
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Bounded alert list with severity, age, locality, partner, order/job references, custody state and recommended review action}
        '403': {description: Delivery operator permission required}
        '503': {description: Dispatch disabled}
  /admin/delivery-recovery-cases/{caseId}/events:
    get:
      summary: Read immutable, sanitized events for one recovery case
      description: Requires primary superadmin or an active Admin with delivery_operator permission. Does not return OTPs, precise location, customer contact, or rider KYC.
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: caseId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Recovery event history in chronological order}
        '403': {description: Delivery operator permission required}
        '404': {description: Recovery case not found}
        '503': {description: Dispatch disabled}
  /admin/delivery-jobs/{jobId}/recovery:
    post:
      summary: Cancel before pickup or release an assignment for sequential redispatch
      description: Requires partner no-handover evidence, expected assignment and execution state, reason, and Idempotency-Key. Custody after pickup is never released through this API.
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [action, reason, expected_assignment_id, expected_execution_state, partner_confirmed_no_handover], properties: {action: {type: string, enum: [release_and_reassign_before_pickup, cancel_before_pickup]}, reason: {type: string, minLength: 10, maxLength: 500}, expected_assignment_id: {type: string, format: uuid}, expected_execution_state: {type: string, enum: [assigned, arriving_at_pickup, at_pickup, pickup_failed]}, partner_confirmed_no_handover: {type: boolean, enum: [true]}}}
      responses:
        '200': {description: Recovery applied or idempotently replayed}
        '403': {description: Delivery operator permission required}
        '409': {description: Stale assignment/state, custody, or idempotency conflict}
        '422': {description: Recovery preconditions are not satisfied}
        '503': {description: Dispatch disabled}
  /admin/delivery-jobs/{jobId}/return/finalize:
    post:
      summary: Finalize an inspected physical return and its explicit inventory disposition
      description: Requires delivery operator permission and Idempotency-Key. Only restockable returns release reserved stock; not-restockable returns consume the reservation. Payment remains unchanged.
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '200': {description: Return finalized or idempotently replayed; order remains unpaid}
        '403': {description: Delivery operator permission required}
        '409': {description: Return is not inspected or idempotency conflict}
  /admin/delivery-offers/{offerId}/cancel:
    post:
      summary: Cancel an active rider offer with an audit reason
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: offerId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '200': {description: Offer cancelled and dispatch advances}
  /merchant/businesses/{businessId}/delivery-dispatch:
    get:
      summary: Read delivery assignment status for an authorized business
      tags: [delivery-status]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Dispatch states for the business's orders}
        '403': {description: Active business membership required}
  /orders/{id}/delivery-status:
    get:
      summary: Read dispatch state for the authenticated customer's own order
      tags: [delivery-status]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Delivery state without rider identity, location, or ETA}
        '404': {description: Order is not owned by the customer or has no dispatch job}
  /rider/delivery-jobs/{jobId}/state:
    post:
      summary: Advance an assigned rider through arrival and return-in-progress states
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [state], properties: {state: {type: string, enum: [arriving_at_pickup, at_pickup, en_route, return_in_progress]}}}
      responses:
        '200': {description: Authorized execution state transition recorded}
        '403': {description: Active approved rider/locality required}
        '409': {description: Invalid state transition or partner order is not ready}
  /rider/delivery-jobs/{jobId}/pickup/verify:
    post:
      summary: Verify partner handover using the short-lived pickup code
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{8}$'}}}
      responses:
        '200': {description: Pickup handover verified and auditable}
        '401': {description: Incorrect, expired, or exhausted verification code}
        '409': {description: Pickup prerequisites are not met}
  /rider/delivery-jobs/{jobId}/delivery/confirm:
    post:
      summary: Complete delivery using the owning customer's one-time code
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[0-9]{8}$'}
                confirm_cod_collection:
                  type: boolean
                  description: Required true only for a synthetic QA COD order; amount is fixed by the server-side obligation.
      responses:
        '200': {description: Customer-verified delivery completion; idempotent on retry}
        '401': {description: Incorrect, expired, or exhausted verification code}
        '409': {description: Delivery is not en route or customer code is unavailable}
  /rider/delivery-jobs/{jobId}/exceptions:
    post:
      summary: Report a pickup or delivery exception
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [type, reason], properties: {type: {type: string, enum: [pickup_failed, customer_unreachable, delivery_failed, return_required]}, reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '201': {description: Exception recorded and scoped parties notified}
        '409': {description: Exception is invalid for current delivery state}
  /rider/delivery-jobs/{jobId}/unable-to-continue:
    post:
      summary: Open an auditable recovery case for the authenticated rider's active assignment
      description: Does not release assignment or transfer physical custody. Requires an Idempotency-Key.
      tags: [rider]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '201': {description: Recovery case created or idempotently replayed}
        '403': {description: Approved active rider access is required}
        '404': {description: Active assignment not owned by rider}
        '409': {description: Idempotency key reused with a different payload}
  /merchant/businesses/{businessId}/delivery-jobs/{jobId}/recovery/no-handover:
    post:
      summary: Record partner-confirmed evidence that goods were not handed to the rider
      description: Bound to the active assignment and business; required before Admin can release an assignment pre-pickup. Requires Idempotency-Key.
      tags: [delivery-status]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [assignment_id, reason], properties: {assignment_id: {type: string, format: uuid}, reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '200': {description: No-handover evidence recorded or idempotently replayed}
        '403': {description: Active membership for assigned business required}
        '409': {description: Assignment/custody conflict or idempotency conflict}
  /merchant/businesses/{businessId}/delivery-jobs/{jobId}/return/disposition:
    post:
      summary: Record inventory condition after the partner receives a physical return
      description: Does not restore inventory; separate Admin finalization applies the disposition. Requires Idempotency-Key.
      tags: [delivery-status]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [inventory_disposition, reason], properties: {inventory_disposition: {type: string, enum: [restockable, not_restockable]}, reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '200': {description: Partner inspection recorded; awaiting Admin finalization}
        '403': {description: Active membership for assigned business required}
        '409': {description: Return/disposition conflict or idempotency conflict}
  /merchant/businesses/{businessId}/delivery-jobs/{jobId}/pickup-code:
    post:
      summary: Issue a short-lived code for an assigned rider handover
      tags: [delivery-status]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Pickup code shown only to authorized assigned partner}
        '403': {description: Business membership required}
        '409': {description: Partner order is not ready or rider has not arrived}
  /merchant/businesses/{businessId}/delivery-jobs/{jobId}/return/confirm:
    post:
      summary: Confirm physical return handover to the assigned partner
      tags: [delivery-status]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Return receipt recorded; inventory is not automatically restored}
        '403': {description: Business membership required}
  /orders/{id}/delivery-code:
    post:
      summary: Issue a short-lived delivery code to the authenticated owning customer
      tags: [delivery-status]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: One-time code returned only to owning customer after rider is en route}
        '404': {description: Order not found for customer}
        '409': {description: Delivery is not en route}
        '429': {description: Code request cooldown}
  /orders/{id}/delivery-history:
    get:
      summary: Read customer-owned delivery execution milestones
      tags: [delivery-status]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Ordered delivery execution events without OTP values}
        '404': {description: Order not found for customer}
  /admin/delivery-exceptions:
    get:
      summary: List open delivery exceptions for Admin review
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Open exceptions with order reference and current execution state}
  /admin/delivery-jobs/{jobId}/exceptions/{exceptionId}/resolve:
    post:
      summary: Resolve an exception with an audited and idempotent return or pre-pickup cancellation action
      tags: [admin-riders]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: exceptionId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [action, reason], properties: {action: {type: string, enum: [require_return, cancel_before_pickup]}, reason: {type: string, minLength: 10, maxLength: 500}, expected_assignment_id: {type: string, format: uuid, description: Required for require_return; binds the action to the active custody assignment.}}}
      responses:
        '200': {description: Audited operational exception resolution; repeated require_return requests replay safely and delivery OTP is never bypassed}
        '403': {description: Primary superadmin or delivery_operator permission required}
        '409': {description: Assignment or custody state changed, idempotency key conflict, or resolution incompatible with current state}

  /admin/finance/access-grants:
    get:
      summary: List two-person finance access grant requests
      description: Isolated QA/test only. Requires finance.configure; returns no OTP or authentication secrets.
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Grant request history, requester, independent decision maker, and outcomes}
        '403': {description: Finance configure permission required}
        '404': {description: Finance grant management unavailable outside isolated QA}
  /admin/finance/capabilities:
    get:
      summary: Read current finance capabilities for the authenticated Admin
      description: Server-derived presentation capabilities. Write endpoints independently enforce the same permissions.
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current finance read and post capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [finance_read, finance_post]
                    properties:
                      finance_read: {type: boolean}
                      finance_post: {type: boolean}
        '401': {description: Authentication required}
  /admin/finance/access-grant-requests:
    post:
      summary: Request limited finance.read or finance.post access for an active Admin
      description: Requester must have finance.configure. A different finance.configure principal must decide; finance.configure and finance.reverse cannot be granted through this workflow.
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [target_user_id, permission, reason], properties: {target_user_id: {type: string, format: uuid}, permission: {type: string, enum: [finance.read, finance.post]}, reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '201': {description: Pending request created and audited; no permission is active yet}
        '400': {description: Invalid target, permission, or reason}
        '403': {description: Finance configure permission required}
        '409': {description: Permission already active or request pending}
  /admin/finance/access-grant-requests/{requestId}/decision:
    post:
      summary: Independently approve or reject a finance access request
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: requestId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [decision, reason], properties: {decision: {type: string, enum: [approve, reject]}, reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        '200': {description: Independent decision recorded; approval atomically creates the limited finance grant and audit events}
        '403': {description: Finance configure permission required; requester, target, and approver must be distinct}
        '404': {description: Request not found}
        '409': {description: Request already resolved or target no longer eligible}
  /admin/finance/commission-policies:
    get:
      summary: List effective-dated merchant commission policy versions
      description: Active Platform Admin access is required.
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Policy versions and independent approval state}
        '403': {description: Active Platform Admin access required}
    post:
      summary: Create a draft commission policy
      description: Draft policies do not affect payable calculations. Approval requires a different finance principal.
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_key, version, vertical, commission_type, effective_from]
              properties:
                policy_key: {type: string, minLength: 1, maxLength: 100}
                version: {type: integer, minimum: 1}
                business_id: {type: string, format: uuid}
                vertical: {type: string, enum: [food, grocery]}
                commission_type: {type: string, enum: [percentage_bps, fixed_minor]}
                percentage_bps: {type: integer, minimum: 0, maximum: 10000}
                fixed_minor: {type: integer, minimum: 0}
                effective_from: {type: string, format: date-time}
                effective_until: {type: string, format: date-time, nullable: true}
      responses:
        '201': {description: Draft created; it is not yet applicable}
        '400': {description: Invalid policy details}
        '403': {description: Finance configure grant required}
  /admin/finance/commission-policies/{policyId}/decision:
    post:
      summary: Independently approve or reject a draft commission policy
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: policyId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [decision, reason], properties: {decision: {type: string, enum: [approve, reject]}, reason: {type: string, minLength: 5, maxLength: 300}}}
      responses:
        '200': {description: Policy decision recorded in append-only finance audit}
        '403': {description: Finance configure grant required; self approval forbidden}
        '409': {description: Policy is no longer a draft or effective period conflicts}
  /admin/finance/eligible-orders:
    get:
      summary: List delivered orders with verified sandbox payment or synthetic COD collection eligible for payable accrual
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Authoritative eligible order and immutable partner supply snapshot summary}
        '403': {description: Active Platform Admin access required}
  /admin/finance/orders/{orderId}/accrue-payable:
    post:
      summary: Accrue one immutable merchant payable snapshot for a delivered, paid platform order
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: orderId, required: true, schema: {type: string, format: uuid}}
      responses:
        '201': {description: Payable snapshot and balanced journal created, idempotently}
        '403': {description: Finance post grant required}
        '409': {description: Payment, delivery, supply snapshot, refund or commission policy is not eligible}
  /admin/finance/payables:
    get:
      summary: List immutable merchant payable snapshots
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: business_id, schema: {type: string, format: uuid}}
        - {in: query, name: currency, schema: {type: string, enum: [INR]}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200': {description: Payable snapshots with funding/allocation status; no external transfer is implied}
        '403': {description: Active Platform Admin access required}
  /admin/finance/qa-funding-pools:
    post:
      summary: Record explicit synthetic QA funding for an eligible sandbox UPI order
      description: Not provider settlement or available real funds. This route is unavailable outside QA/test.
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [order_id, amount_minor, funding_reference, reason], properties: {order_id: {type: string, format: uuid}, amount_minor: {type: integer, minimum: 1}, funding_reference: {type: string, minLength: 8, maxLength: 120}, reason: {type: string, minLength: 10, maxLength: 300}}}
      responses:
        '201': {description: Synthetic QA funding record created}
        '403': {description: QA-only or finance-post grant required}
        '409': {description: Amount exceeds verified capture net of refunds}
  /admin/finance/settlements:
    get:
      summary: List simulated merchant settlement batches
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Settlement lifecycle and explicit simulation-only disclosure}
        '403': {description: Active Platform Admin access required}
    post:
      summary: Create an idempotent single-merchant settlement simulation draft
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [payable_ids, period_start, period_end, idempotency_key], properties: {payable_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}, period_start: {type: string, format: date}, period_end: {type: string, format: date}, idempotency_key: {type: string, format: uuid}}}
      responses:
        '201': {description: Draft created; no fund transfer occurs}
        '409': {description: Payable allocation or funding eligibility conflict}
  /admin/finance/settlements/{batchId}/{action}:
    post:
      summary: Review, approve, simulate, or reconcile a settlement batch
      description: Each transition requires separate finance principals. Simulate posts to a synthetic clearing account only.
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: batchId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: action, required: true, schema: {type: string, enum: [review, approve, simulate, reconcile]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 5, maxLength: 500}}}
      responses:
        '200': {description: Authorized transition recorded; simulation is not an external payout}
        '403': {description: Finance grant or separation-of-duties requirement failed}
        '409': {description: Invalid state, insufficient eligible funding, or reconciliation exception}
  /admin/finance/reconcile:
    post:
      summary: Run read-only merchant payable and settlement reconciliation
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Detected exceptions persisted; no automatic repairs}
  /admin/finance/reconciliation-exceptions:
    get:
      summary: List persisted merchant finance reconciliation exceptions
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Read-only exceptions}
        '403': {description: Active Platform Admin access required}
  /admin/finance/payable-adjustments:
    get:
      summary: List merchant payable adjustment requests
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Adjustment requests and review states}
        '403': {description: Active Platform Admin access required}
    post:
      summary: Request an audited payable adjustment
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [payable_id, amount_minor, adjustment_type, reason_code, reason, idempotency_key], properties: {payable_id: {type: string, format: uuid}, amount_minor: {type: integer, minimum: 1}, adjustment_type: {type: string, enum: [credit, debit]}, reason_code: {type: string, enum: [refund_review, return_review, contract_correction, other]}, reason: {type: string, minLength: 10}, idempotency_key: {type: string, format: uuid}}}
      responses:
        '201': {description: Adjustment request recorded; it requires independent review}
  /admin/finance/payable-adjustments/{adjustmentId}/review:
    post:
      summary: Independently approve or reject a payable adjustment
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: adjustmentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [decision, reason], properties: {decision: {type: string, enum: [approve, reject]}, reason: {type: string, minLength: 5, maxLength: 300}}}
      responses:
        '200': {description: Reviewed adjustment with balanced journal if approved}
        '403': {description: Finance post grant required; requester cannot self review}
  /merchant/businesses/{businessId}/finance/overview:
    get:
      summary: Read this merchant's server-derived financial overview
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Read-only gross, supply basis, commission, pending payable and total simulated/reconciled settlement amount; simulation is not an external payout}
        '404': {description: Caller is not an active member of this business}
  /merchant/businesses/{businessId}/finance/payables:
    get:
      summary: Read this merchant's order-level payable snapshots
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Read-only, business-scoped payable history; no settlement transfer implied}
        '404': {description: Caller is not an active member of this business}
  /merchant/businesses/{businessId}/finance/settlements:
    get:
      summary: Read this merchant's simulated settlement history
      tags: [merchant-finance]
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: businessId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Read-only settlement and payout workflow history with no bank-credit claim; payout and latest attempt statuses are provided when present
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        payout_status: {type: string, nullable: true}
                        latest_attempt_status: {type: string, nullable: true}
                        payout_completed_at: {type: string, nullable: true}
                        payout_simulation_only: {type: boolean, enum: [true]}
                        disclosure: {type: string}
        '404': {description: Caller is not an active member of this business}

# ---------------------------------------------------------------
# Components
# ---------------------------------------------------------------
components:
  schemas:
    SettlementHistoryRecord:
      type: object
      required: [settlement_id, currency, period_start, period_end, adjustments_minor, net_minor, settlement_status, created_at, simulation_only, disclosure]
      properties:
        settlement_id: {type: string, format: uuid}
        currency: {type: string, example: INR}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        gross_minor: {type: integer, format: int64}
        payable_minor: {type: integer, format: int64}
        adjustments_minor: {type: integer, format: int64}
        net_minor: {type: integer, format: int64}
        settlement_status: {type: string}
        payout_status: {type: string, nullable: true}
        latest_attempt_status: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        simulated_at: {type: string, format: date-time, nullable: true}
        payout_completed_at: {type: string, format: date-time, nullable: true}
        simulation_only: {type: boolean, enum: [true]}
        disclosure: {type: string}
    PlatformCatalogArea:
      type: object
      properties:
        city: {type: string, enum: [Cuttack, Jajpur], description: Legacy district field retained for existing Admin clients}
        locality: {type: string, maxLength: 100}
        district_id: {type: string, format: uuid, description: Stable district reference}
        locality_id: {type: string, format: uuid, description: Stable locality reference; locality must belong to district_id}
    PlatformCatalogVariantInput:
      type: object
      required: [sku, name, unit_label, price_minor]
      properties:
        sku: {type: string, maxLength: 80}
        name: {type: string, maxLength: 120}
        unit_label: {type: string, maxLength: 40}
        price_minor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, enum: [INR], default: INR}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/otp/verify

  parameters:
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Search query (shop name, category, product, service)
    Lat:
      name: lat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      example: 20.46
      description: Latitude
    Lng:
      name: lng
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      example: 85.88
      description: Longitude
    RadiusM:
      name: radius_m
      in: query
      schema:
        type: integer
        minimum: 100
        maximum: 50000
        default: 5000
      example: 5000
      description: Search radius in metres
    CategorySlug:
      name: category_slug
      in: query
      schema:
        type: string
      example: "hardware"
    OpenNow:
      name: open_now
      in: query
      schema:
        type: boolean
      description: Filter to currently open businesses
    AvailableNow:
      name: available_now
      in: query
      schema:
        type: boolean
      description: Filter to professionals accepting requests now
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [relevance, distance, recent]
        default: relevance
      description: Sort by query relevance, proximity, or newest approved listing.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Cursor for pagination
    Lang:
      name: lang
      in: query
      schema:
        type: string
        default: "en"
      description: Preferred language
    BusinessId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Business ID
    BusinessIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Status:
      name: status
      in: query
      schema:
        type: string
      description: Filter by status

  schemas:
    AvailabilitySlot:
      type: object
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        local_date: {type: string, format: date}
        local_starts_at: {type: string, example: '10:00'}
        local_ends_at: {type: string, example: '11:00'}
        capacity: {type: integer, minimum: 1}
        booked_count: {type: integer, minimum: 0}
        remaining_capacity: {type: integer, minimum: 0}
        status: {type: string, enum: [open, closed]}
        time_zone: {type: string, example: Asia/Kolkata}
    AvailabilityException:
      type: object
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        is_closed: {type: boolean}
        opens_at: {type: string, nullable: true, example: '10:00'}
        closes_at: {type: string, nullable: true, example: '15:00'}
        note: {type: string, maxLength: 240}
    CreateAvailabilitySlotRequest:
      type: object
      required: [date, starts_at, ends_at, capacity]
      properties:
        date: {type: string, format: date}
        starts_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '10:00'}
        ends_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '11:00'}
        capacity: {type: integer, minimum: 1, maximum: 20}
    UpdateAvailabilitySlotRequest:
      type: object
      properties:
        date: {type: string, format: date}
        starts_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        ends_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        capacity: {type: integer, minimum: 1, maximum: 20}
        status: {type: string, enum: [open, closed]}
    AvailabilityExceptionRequest:
      type: object
      required: [date, is_closed]
      properties:
        date: {type: string, format: date}
        is_closed: {type: boolean}
        opens_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        closes_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        note: {type: string, maxLength: 240}

    CreateCustomerOrderRequest:
      type: object
      required: [order_type]
      properties:
        order_type: {type: string, enum: [food_delivery, table_reservation, hotel_booking]}
        checkout_quote_id: {type: string, format: uuid, description: Required for Phase 2C food ordering}
        fulfillment_type: {type: string, enum: [delivery, takeaway]}
        delivery_address: {type: string, maxLength: 500}
        payment_method: {type: string, enum: [cash_on_delivery, upi]}
        notes: {type: string, maxLength: 1000}
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1, maximum: 50}
        reservation_at: {type: string, format: date-time}
        reservation_end_at: {type: string, format: date-time}
        guest_count: {type: integer, minimum: 1, maximum: 30}
        seating_area: {type: string, maxLength: 80}
        room_product_id: {type: string, format: uuid}

    CreateCheckoutQuoteRequest:
      type: object
      required: [fulfillment_type, items]
      properties:
        fulfillment_type: {type: string, enum: [delivery, takeaway]}
        address_id: {type: string, format: uuid, description: Required for delivery and omitted for takeaway}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1, maximum: 50}

    PlatformCheckoutQuoteRequest:
      type: object
      required: [vertical, address_id, items]
      properties:
        vertical: {type: string, enum: [food, grocery]}
        address_id: {type: string, format: uuid}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [variant_id, quantity]
            properties:
              variant_id: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1, maximum: 50}

    PlatformCheckoutSubmitRequest:
      type: object
      required: [quote_id, payment_method]
      properties:
        quote_id: {type: string, format: uuid}
        notes: {type: string, maxLength: 1000}
        payment_method: {type: string, enum: [upi, cash_on_delivery], description: Must be one of the methods reported available by the quote; UPI is sandbox-only and COD is synthetic QA only}

    CustomerAddressInput:
      type: object
      required: [label, recipient_name, address_line1, locality, city, state, postal_code, contact_phone]
      properties:
        label: {type: string, minLength: 1, maxLength: 40}
        recipient_name: {type: string, minLength: 1, maxLength: 100}
        address_line1: {type: string, minLength: 3, maxLength: 200}
        locality: {type: string, minLength: 1, maxLength: 100}
        locality_id: {type: string, format: uuid, description: Stable delivery locality ID; required for Grepmind platform checkout}
        landmark: {type: string, maxLength: 120}
        city: {type: string, enum: [Cuttack, Jajpur]}
        state: {type: string, minLength: 1, maxLength: 80}
        postal_code: {type: string, pattern: '^[0-9]{6}$'}
        contact_phone: {type: string, pattern: '^(\+91)?[6-9][0-9]{9}$'}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        is_default: {type: boolean, default: false}

    Meta:
      type: object
      properties:
        request_id:
          type: string
          example: "req_abc123"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    StandardResponse:
      type: object
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/Meta'

    BusinessMember:
      type: object
      required: [id, business_id, user_id, phone_e164, role, status]
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        phone_e164:
          type: string
          example: "+919861000005"
        role:
          type: string
          enum: [owner, manager, staff]
        status:
          type: string
          enum: [active, suspended, revoked]
        created_at:
          type: string
          format: date-time

    AddBusinessMemberRequest:
      type: object
      required: [phone_e164, role]
      properties:
        phone_e164:
          type: string
          example: "+919861000005"
        role:
          type: string
          enum: [manager, staff]
        display_name:
          type: string
          example: "Rakesh Mohapatra"

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: "The request contains invalid fields."
            details:
              type: object
              description: Field-specific validation errors
            request_id:
              type: string
              example: "req_abc123"

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_e164:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        status:
          type: string
        preferred_language:
          type: string
        notification_preferences:
          type: object
          properties:
            booking_updates: {type: boolean}
            offers: {type: boolean}
            service_updates: {type: boolean}
        roles:
          type: array
          items:
            type: string
            enum: [customer, merchant, professional, admin, rider, delivery_operator]
        rider_status:
          type: string
          nullable: true
          enum: [draft, submitted, under_review, changes_requested, approved, rejected, suspended]
          description: Server-read application status. A rider role without approved status does not authorize rider workspace access.
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        icon_name:
          type: string
        description:
          type: string

    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        category_slug:
          type: string
        category_name:
          type: string
        address_text:
          type: string
        city:
          type: string
        distance_m:
          type: integer
        status:
          type: string
        verification_status:
          type: string
        phone_e164:
          type: string
        whatsapp_e164:
          type: string
        is_open_now:
          type: boolean
        accepts_requests:
          type: boolean
        cover_photo_url:
          type: string
        created_at:
          type: string
          format: date-time

    BusinessDetail:
      allOf:
        - $ref: '#/components/schemas/Business'
        - type: object
          properties:
            description:
              type: string
            postal_code:
              type: string
            location:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
            business_hours:
              type: array
              items:
                $ref: '#/components/schemas/BusinessHour'
            products:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            offers:
              type: array
              items:
                $ref: '#/components/schemas/Offer'
            services:
              type: array
              items:
                $ref: '#/components/schemas/Service'
            media:
              type: array
              items:
                $ref: '#/components/schemas/BusinessMedia'
            service_radius_m:
              type: integer
            experience_years:
              type: integer
            service_description:
              type: string
            next_available_appointment:
              type: string
              format: date-time
              nullable: true

    BusinessHour:
      type: object
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type: string
          nullable: true
        closes_at:
          type: string
          nullable: true
        is_closed:
          type: boolean

    CreateBusinessRequest:
      type: object
      required: [name, category_slug, address_text, locality, city, postal_code, latitude, longitude, hours]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        category_slug:
          type: string
        phone_e164:
          type: string
        whatsapp_e164:
          type: string
        address_text:
          type: string
        locality:
          type: string
        city:
          type: string
        postal_code:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        cover_photo_url:
          type: string
          description: Relative URL returned by an owned storefront media upload.
        hours:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/BusinessHourInput'

    UpdateBusinessRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category_slug:
          type: string
        phone_e164:
          type: string
        whatsapp_e164:
          type: string
        address_text:
          type: string
        locality:
          type: string
        city:
          type: string
        postal_code:
          type: string

    BusinessHourInput:
      type: object
      required: [weekday]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type: string
          nullable: true
        closes_at:
          type: string
          nullable: true
        is_closed:
          type: boolean

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string
        stock_status:
          type: string
        inventory_mode:
          type: string
          enum: [untracked, finite]
        available_quantity:
          type: integer
          minimum: 0
          nullable: true
        is_published:
          type: boolean
        image_url:
          type: string
          nullable: true
        unit_label:
          type: string
          nullable: true
        mrp:
          type: number
          format: double
          nullable: true
        barcode:
          type: string
          nullable: true
        grocery_category:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: double
        currency:
          type: string
          default: INR
        stock_status:
          type: string
          enum: [unknown, in_stock, out_of_stock, limited]
          default: unknown
        inventory_mode:
          type: string
          enum: [untracked, finite]
          default: untracked
        available_quantity:
          type: integer
          minimum: 0
          nullable: true
        unit_label:
          type: string
          nullable: true
        mrp:
          type: number
          format: double
          nullable: true
        barcode:
          type: string
          nullable: true
        grocery_category:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        is_published:
          type: boolean
          default: false

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string
        stock_status:
          type: string
          enum: [unknown, in_stock, out_of_stock, limited]
        inventory_mode:
          type: string
          enum: [untracked, finite]
        available_quantity:
          type: integer
          nullable: true
        unit_label:
          type: string
          nullable: true
        mrp:
          type: number
          format: double
          nullable: true
        barcode:
          type: string
          nullable: true
        grocery_category:
          type: string
          nullable: true
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string
        stock_status:
          type: string
          enum: [unknown, in_stock, out_of_stock, limited]
        inventory_mode:
          type: string
          enum: [untracked, finite]
        available_quantity:
          type: integer
          minimum: 0
          nullable: true
        is_published:
          type: boolean
        image_url:
          type: string
          nullable: true

    CartValidationResponse:
      type: object
      properties:
        data:
          type: object
          required: [business_id, items, item_subtotal_minor, minimum_order_minor, currency, valid, minimum_met]
          properties:
            business_id: {type: string, format: uuid}
            business_name: {type: string}
            item_subtotal_minor: {type: integer, minimum: 0}
            minimum_order_minor: {type: integer, minimum: 0}
            currency: {type: string, example: INR}
            valid: {type: boolean}
            minimum_met: {type: boolean}
            items:
              type: array
              items:
                type: object
                required: [product_id, quantity, available]
                properties:
                  product_id: {type: string, format: uuid}
                  name: {type: string}
                  quantity: {type: integer}
                  available: {type: boolean}
                  reason: {type: string, enum: [unavailable, insufficient_stock]}
                  unit_price_minor: {type: integer, minimum: 0}
                  line_total_minor: {type: integer, minimum: 0}
                  inventory_mode: {type: string, enum: [untracked, finite]}
                  available_quantity: {type: integer, nullable: true}
        meta:
          $ref: '#/components/schemas/Meta'

    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        indicative_price_min:
          type: number
          format: double
          nullable: true
        indicative_price_max:
          type: number
          format: double
          nullable: true
        currency:
          type: string
        is_active:
          type: boolean

    Offer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        business_name:
          type: string
          description: Present on administrator offer-list responses.
        title:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
        image_url:
          type: string
          nullable: true
        terms:
          type: string
          nullable: true
        discount_percent:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    CityOffer:
      allOf:
        - $ref: '#/components/schemas/Offer'
        - type: object
          required: [business_name, business_city]
          properties:
            business_name: {type: string}
            business_city: {type: string, enum: [Cuttack, Jajpur]}
            business_locality: {type: string}
            business_photo_url: {type: string}

    CityCatalogItem:
      type: object
      required: [id, item_type, business_id, business_name, business_city, category_name, name, currency, published_at]
      properties:
        id: {type: string, format: uuid}
        item_type: {type: string, enum: [product, service]}
        business_id: {type: string, format: uuid}
        business_name: {type: string}
        business_city: {type: string, enum: [Cuttack, Jajpur]}
        business_locality: {type: string}
        category_name: {type: string}
        name: {type: string}
        description: {type: string}
        price: {type: number, format: double}
        price_max: {type: number, format: double}
        currency: {type: string, example: INR}
        image_url: {type: string}
        published_at: {type: string, format: date-time}

    CreateOfferRequest:
      type: object
      required: [title, starts_at, ends_at]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        terms:
          type: string
          maxLength: 1000
        discount_percent:
          type: integer
          minimum: 0
          maximum: 100
        image_url:
          type: string
          nullable: true

    UpdateOfferRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        terms:
          type: string
        discount_percent:
          type: integer
          nullable: true

    CreateServiceRequestRequest:
      type: object
      required: [business_id, description]
      properties:
        business_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
          nullable: true
        slot_id:
          type: string
          format: uuid
          nullable: true
          description: Required whenever requested_for is supplied; the slot determines the authoritative scheduled time.
        description:
          type: string
          minLength: 5
          maxLength: 1000
        requested_for:
          type: string
          format: date-time
          description: Scheduled time; the server derives the stored value from slot_id and rejects time-only scheduling.
          nullable: true

    RescheduleServiceRequestRequest:
      type: object
      required: [slot_id]
      properties:
        slot_id:
          type: string
          format: uuid
          description: A different, open, future slot belonging to the request's business with available capacity.

    ServiceRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_user_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
          nullable: true
        slot_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        requested_for:
          type: string
          format: date-time
          nullable: true
        requested_local_date:
          type: string
          format: date
          nullable: true
          description: Appointment date in the merchant business time zone; returned by the merchant request listing.
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporter_user_id:
          type: string
          format: uuid
          nullable: true
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    BusinessMedia:
      type: object
      properties:
        id:
          type: string
          format: uuid
        object_key:
          type: string
        media_type:
          type: string
        sort_order:
          type: integer
        url:
          type: string
          nullable: true

    AdminStats:
      type: object
      properties:
        pending_verifications:
          type: integer
          example: 3
        reported_listings:
          type: integer
          example: 1
        pending_offers:
          type: integer
          example: 2
        active_listings:
          type: integer
          example: 12
        pending_claims:
          type: integer
        service_requests:
          type: integer
        customer_orders:
          type: integer
        active_accounts:
          type: integer
        notification_events:
          type: integer
