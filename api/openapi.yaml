openapi: 3.0.3
info:
  title: Grepmind Near API
  version: v1
  description: |
    Local discovery platform API for customers, merchants, professionals,
    and administrators. Base path: /api/v1
    Active business coverage is restricted to Cuttack and Jajpur.
  contact:
    name: Grepmind Near
    email: support@grepmind.local
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.grepmind.local/api/v1
    description: Staging
tags:
  - name: auth
    description: Phone OTP authentication and session management
  - name: me
    description: Authenticated user profile
  - name: discovery
    description: Categories, business search, nearby, business details
  - name: catalog
    description: Public Grepmind-owned Food and Grocery catalog
  - name: merchant
    description: Merchant business, products, offers, service requests
  - name: customer
    description: Customer service requests and favourites
  - name: payments
    description: Server-verified sandbox payment attempts and provider events; live collection remains disabled
  - name: admin
    description: Administrator moderation and operations
  - name: admin-catalog
    description: Administrator management of platform products and fulfillment mappings
  - name: media
    description: Direct media uploads and MinIO S3 object storage
  - name: notifications
    description: Real-time SSE event streaming and persistent notification management
  - name: rider
    description: Approved rider availability, offers, and active assignments
  - name: admin-riders
    description: Rider approval and delivery dispatch administration
  - name: rider-earnings
    description: Rider compensation ledger and isolated-QA settlement status; real payouts remain disabled
  - name: delivery-status
    description: Customer and merchant-scoped dispatch status
  - name: health
    description: Health checks

paths:
  /rider/earnings/summary:
    get:
      tags: [rider-earnings]
      summary: Read the authenticated rider's recorded compensation summary
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Own earnings totals are decimal strings of integer minor units grouped by currency; no payout status}
        '400': {description: Invalid or overlong date range}
        '403': {description: Approved active rider access required}
  /rider/earnings:
    get:
      tags: [rider-earnings]
      summary: List the authenticated rider's append-only earnings entries
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000}}
      responses:
        '200': {description: Own entries; amount_minor is a decimal string of integer minor units or null for unpriced compensation}
        '403': {description: Approved active rider access required}
  /rider/earnings/{entryId}:
    get:
      tags: [rider-earnings]
      summary: Read one earning entry owned by the authenticated rider
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: entryId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Earning amount_minor is a decimal string of integer minor units; settlement status is available separately from /rider/settlements}
        '404': {description: Entry not found for this rider}
  /rider/settlements:
    get:
      tags: [rider-earnings]
      summary: Read the authenticated rider's settlement and isolated-QA payout status history
      description: Read-only. Returns only batches owned by the authenticated active rider. Does not expose transfer identifiers, bank details, provider identifiers, UTRs, or COD liability. Available in isolated QA/test only; simulation status is not bank credit.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Own settlement batches and transfer workflow statuses in integer minor units; simulation_only is true and no money moves
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettlementHistoryRecord'
        '400': {description: Invalid limit}
        '403': {description: Approved active rider access required}
        '404': {description: Endpoint is unavailable outside isolated QA/test}
  /admin/rider-earnings/overview:
    get:
      tags: [rider-earnings]
      summary: Admin rider compensation overview (primary superadmin only)
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
        - {in: query, name: locality_id, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Aggregated totals are decimal strings of integer minor units, grouped by rider and currency}
        '403': {description: Primary superadmin access required}
  /admin/rider-earnings/localities:
    get:
      tags: [rider-earnings]
      summary: List localities represented in the ledger (primary superadmin only)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Ledger-scoped delivery localities}
        '403': {description: Primary superadmin access required}
  /admin/rider-earnings/entries:
    get:
      tags: [rider-earnings]
      summary: Admin ledger entry list (primary superadmin only)
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
        - {in: query, name: rider_id, schema: {type: string, format: uuid}}
        - {in: query, name: locality_id, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000}}
      responses:
        '200': {description: Immutable ledger amounts are decimal strings of integer minor units or null when unpriced}
        '403': {description: Primary superadmin access required}
  /admin/rider-earnings/audit:
    get:
      tags: [rider-earnings]
      summary: Admin earnings audit history (primary superadmin only)
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000}}
      responses:
        '200': {description: Append-only earnings audit events}
        '403': {description: Primary superadmin access required}
  /admin/rider-earnings/policies:
    get:
      tags: [rider-earnings]
      summary: Inspect compensation policy versions (primary superadmin only)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Policy fixed_amount_minor values are decimal strings of integer minor units; policy changes are disabled pending commercial approval}
        '403': {description: Primary superadmin access required}
  /admin/rider-earnings/reconciliation:
    get:
      tags: [rider-earnings]
      summary: Report delivery-to-ledger discrepancies (primary superadmin only)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Read-only discrepancy report; no automatic ledger repairs}
        '403': {description: Primary superadmin access required}
  /admin/rider-earnings/adjustments:
    post:
      tags: [rider-earnings]
      summary: Record a reasoned compensation adjustment (primary superadmin only)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rider_user_id, amount_minor, currency, reason, idempotency_key]
              properties:
                rider_user_id: {type: string, format: uuid}
                delivery_job_id: {type: string, format: uuid}
                amount_minor: {type: integer, format: int64, not: {enum: [0]}}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                reason: {type: string, minLength: 10, maxLength: 500}
                idempotency_key: {type: string, minLength: 8, maxLength: 160}
      responses:
        '201': {description: Immutable adjustment entry recorded}
        '400': {description: Invalid adjustment request}
        '403': {description: Primary superadmin access required}
  /admin/rider-earnings/entries/{entryId}/reverse:
    post:
      tags: [rider-earnings]
      summary: Append a reversal for an earning (primary superadmin only)
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: entryId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, idempotency_key]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
                idempotency_key: {type: string, minLength: 8, maxLength: 160}
      responses:
        '201': {description: Compensating ledger entry appended; original remains unchanged}
        '403': {description: Primary superadmin access required}
        '409': {description: Entry cannot be reversed or has already been reversed}
  /locations:
    get:
      tags: [discovery]
      summary: List supported cities from approved businesses
      responses:
        '200':
          description: Live city name, listing count, latitude and longitude in data array (maximum 200 cities).
        '500': {description: Unable to load cities}
  /merchant/catalog-categories:
    get:
      tags: [merchant]
      summary: List categories owned by the current merchant business
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: business_id
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Category list in data, each containing id and name
        '401': {description: Authentication required}
        '403': {description: Business membership required}
    post:
      tags: [merchant]
      summary: Create a merchant catalog category (owner or manager)
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: business_id
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201': {description: Created category in data with id and name}
        '400': {description: Invalid category}
        '401': {description: Authentication required}
        '403': {description: Owner or manager required}
        '409': {description: Duplicate category}
  /merchant/catalog-categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: business_id
        schema: {type: string, format: uuid}
    patch:
      tags: [merchant]
      summary: Rename an owned catalog category
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200': {description: Updated category in data with id and name}
        '400': {description: Invalid category}
        '401': {description: Authentication required}
        '403': {description: Owner or manager required}
        '409': {description: Category conflict}
    delete:
      tags: [merchant]
      summary: Delete an owned catalog category without deleting catalog items
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Category deleted}
        '401': {description: Authentication required}
        '403': {description: Owner or manager required}
        '404': {description: Category not found}
  /media/upload:
    post:
      summary: Upload an image asset to MinIO S3 object storage
      tags: [media]
      description: |
        Accepts multipart/form-data with image payload (JPEG, PNG, WebP) up to 10MB.
        Returns the asset URL served through Nginx proxy and MinIO metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file to upload
                purpose:
                  type: string
                  enum: [storefront, product, service, kyc, avatar, general]
                  default: general
                  description: Organizational bucket prefix
      responses:
        '201':
          description: Media uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      purpose:
                        type: string
                      object_key:
                        type: string
                      url:
                        type: string
                        example: "/media/storefront/20261029_abc123.jpg"
                      public_url:
                        type: string
                        example: "http://localhost/media/storefront/20261029_abc123.jpg"
                      content_type:
                        type: string
                        example: "image/jpeg"
                      size_bytes:
                        type: integer
                      original_name:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Invalid file format or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media:
    get:
      summary: List uploaded media assets
      tags: [media]
      parameters:
        - name: purpose
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of media uploads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /events:
    get:
      summary: Stream authenticated real-time events (Server-Sent Events)
      tags: [notifications]
      description: |
        Establishes an HTTP long-lived text/event-stream connection.
        Subscribers receive real-time push events for service booking creation,
        status transitions, and merchant/customer alerts. Heartbeat pings are sent every 15s.
        An order_id subscription is restricted to the authenticated customer who owns that order,
        receives only events for that order, and closes when its backing session is revoked.
        Reconnect clients should reconcile from the authoritative order and delivery APIs.
      security:
        - bearerAuth: []
      parameters:
        - name: business_id
          in: query
          required: false
          schema:
            type: string
          description: Filter events strictly for this business
        - name: request_id
          in: query
          required: false
          schema:
            type: string
          description: Filter events for a single booking tracking lifecycle
        - name: order_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Stream only events for an order owned by the authenticated customer. Cannot be combined with other scope filters.
      responses:
        '200':
          description: Active event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: service_request.created\ndata: {\"event\":\"service_request.created\",\"title\":\"New Booking Request!\"}\n\n"

  /notifications:
    get:
      summary: Fetch persistent notifications list
      tags: [notifications]
      parameters:
        - name: business_id
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of persistent notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        body:
                          type: string
                        event_type:
                          type: string
                        is_read:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time

  /notifications/{id}/read:
    post:
      summary: Mark a notification as read
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: notification marked as read

  /notifications/broadcast-test:
    post:
      summary: Trigger synthetic test notification broadcast
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id, title]
              properties:
                business_id:
                  type: string
                title:
                  type: string
                body:
                  type: string
                event_type:
                  type: string
      responses:
        '200':
          description: Test event dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /healthz:
    get:
      summary: Health check
      tags: [health]
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ---------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------
  /auth/otp/request:
    post:
      summary: Request a phone OTP
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164]
              properties:
                phone_e164:
                  type: string
                  example: "+919876543210"
                  description: E.164 formatted phone number
      responses:
        '202':
          description: OTP delivery was accepted. The OTP is never returned in the response.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [phone_e164, status, challenge_id, expires_at]
                    properties:
                      phone_e164:
                        type: string
                        format: phone
                      status:
                        type: string
                        enum: [otp_requested]
                      challenge_id:
                        type: string
                        format: uuid
                        description: Non-secret identifier used to bind the verification request.
                      expires_at:
                        type: string
                        format: date-time
                        description: Challenge expiry timestamp; contains no OTP secret.
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/otp/verify:
    post:
      summary: Verify OTP and establish a session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164, otp_code]
              properties:
                phone_e164:
                  type: string
                  example: "+919876543210"
                otp_code:
                  type: string
                  example: "123456"
                challenge_id:
                  type: string
                  format: uuid
                  description: Challenge returned by the OTP request; binds verification to one request.
                idempotency_key:
                  type: string
                  example: "otp-verify-unique-key"
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
                      admin_mpin_enrollment_available:
                        type: boolean
                        description: Present when the Admin session can enroll a PIN on the configured portal.
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/admin-mpin:
    get:
      tags: [auth]
      summary: Check Admin PIN availability and browser enrollment
      security: []
      responses:
        '200':
          description: Whether PIN sign-in is enabled and this browser is enrolled
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [enabled, enrolled]
                    properties:
                      enabled: { type: boolean }
                      enrolled: { type: boolean }
  /auth/admin-mpin/enroll:
    post:
      tags: [auth]
      security: [{bearerAuth: []}]
      summary: Enroll this Admin browser after a recent OTP login
      description: Requires an active Admin bearer session authenticated by OTP on the configured portal origin in the last five minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '204':
          description: Enrolled. Sets a secure, HTTP-only browser credential.
        '400':
          description: Invalid PIN input
        '401':
          description: Recent Admin OTP authentication required
        '403':
          description: Portal origin is not authorized or PIN login is disabled
  /auth/admin-mpin/remove:
    post:
      tags: [auth]
      summary: Remove the enrolled Admin browser PIN
      description: Requires a recent verified Admin OTP session on the configured portal origin. PIN sessions cannot remove their own recovery credential.
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Browser PIN removed and device cookie cleared}
        '401': {description: Recent Admin OTP authentication required}
        '403': {description: Portal origin is not authorized or PIN login is disabled}
  /auth/admin-mpin/verify:
    post:
      tags: [auth]
      summary: Sign in with an Admin PIN and enrolled browser credential
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '200':
          description: Admin session issued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [access_token, refresh_token]
                    properties:
                      access_token: { type: string }
                      refresh_token: { type: string }
        '400':
          description: Invalid PIN input
        '401':
          description: Invalid PIN, unavailable device credential, or Admin access removed
        '403':
          description: Portal origin is not authorized or PIN login is disabled
  /auth/refresh:
    post:
      summary: Rotate refresh credentials
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Revoke the current session
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  # ---------------------------------------------------------------
  # Me (authenticated user)
  # ---------------------------------------------------------------
  /me:
    get:
      summary: Get the authenticated user
      tags: [me]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
    patch:
      summary: Update allowed profile fields
      tags: [me]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                preferred_language:
                  type: string
                  example: "en"
                avatar_url:
                  type: string
                  nullable: true
                  pattern: '^/media/avatar/'
                notification_preferences:
                  type: object
                  additionalProperties: false
                  required: [booking_updates, offers, service_updates]
                  properties:
                    booking_updates: {type: boolean}
                    offers: {type: boolean}
                    service_updates: {type: boolean}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'

  # ---------------------------------------------------------------
  # Discovery
  # ---------------------------------------------------------------
  /categories:
    get:
      summary: Get active categories
      tags: [discovery]
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /businesses:
    get:
      summary: Search businesses by query and filters
      tags: [discovery]
      parameters:
        - in: query
          name: city
          description: Case-insensitive exact city filter, combined with category and optional radius.
          schema: {type: string, maxLength: 120}
        - $ref: '#/components/parameters/Q'
