                  example: "Listing meets platform rules"
      responses:
        '200':
          description: Listing approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '403':
          description: Not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/businesses/{id}/reject:
    post:
      summary: Reject a listing
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: "Incomplete information"
      responses:
        '200':
          description: Listing rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /admin/businesses/{id}/verify:
    post:
      summary: Record verification outcome
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_status]
              properties:
                verification_status:
                  type: string
                  enum: [verified, rejected]
                  example: verified
                reason:
                  type: string
      responses:
        '200':
          description: Verification recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /admin/reports:
    get:
      summary: Review user reports
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reports list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /admin/reports/{id}/resolve:
    post:
      summary: Resolve a report
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [dismissed, action_taken]
                  example: action_taken
                reason:
                  type: string
      responses:
        '200':
          description: Report resolved
          content:
            application/json:
  /admin/offers:
    get:
      summary: Review promotional offers queue
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Promotional offers list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /admin/offers/{id}/approve:
    post:
      summary: Approve promotional offer
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OfferIdPath'
      responses:
        '200':
          description: Offer approved and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /admin/offers/{id}/reject:
    post:
      summary: Reject promotional offer
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OfferIdPath'
      responses:
        '200':
          description: Offer rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /admin/audit-logs:
    get:
      summary: Review administrative activity
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /businesses/{id}/availability:
    get:
      summary: List persisted bookable slots for a business
      tags: [discovery]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - in: query
          name: from
          required: true
          schema: {type: string, format: date-time}
        - in: query
          name: to
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Available slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AvailabilitySlot'}

  /merchant/businesses/{id}/availability:
    get:
      summary: List merchant appointment slots and date exceptions
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - in: query
          name: from
          required: true
          schema: {type: string, format: date}
        - in: query
          name: to
          required: true
          schema: {type: string, format: date}
      responses:
        '200': {description: Business-local slots and date exceptions}
        '404': {description: Business not found or membership unavailable}
  /merchant/businesses/{id}/availability-slots:
    post:
      summary: Create a business-local appointment slot
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAvailabilitySlotRequest'}
      responses:
        '201': {description: Slot created}
        '400': {description: Invalid date, time, or capacity}
        '404': {description: Business not found or membership unavailable}
        '409': {description: Closed date, outside opening hours, past date, or overlapping slot}
  /merchant/businesses/{id}/availability-slots/{slotId}:
    patch:
      summary: Edit or close a future unbooked appointment slot
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - in: path
          name: slotId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAvailabilitySlotRequest'}
      responses:
        '200': {description: Slot updated}
        '400': {description: Invalid update}
        '404': {description: Business or slot not found in this business}
        '409': {description: Slot is booked, past, closed by exception, or overlapping}
  /merchant/businesses/{id}/availability-exceptions:
    put:
      summary: Upsert date-specific closure or local opening hours
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AvailabilityExceptionRequest'}
      responses:
        '200': {description: Date exception saved; unbooked slots close atomically for closed dates}
        '400': {description: Invalid date, custom hours, or note}
        '404': {description: Business not found or membership unavailable}
        '409': {description: Date contains booked appointments and cannot be closed}

  /businesses/{id}/orders:
    post:
      summary: Create a food order, table reservation, or hotel booking
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - in: header
          name: Idempotency-Key
          required: false
          description: Required with checkout_quote_id for food orders. UUID scoped to the authenticated customer; identical retries return the original order.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCustomerOrderRequest'}
      responses:
        '201':
          description: Persisted order with server-calculated totals
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StandardResponse'}
        '200': {description: Original order returned for a valid idempotent retry}
        '400': {description: Missing quote, idempotency key, or invalid order payload}
        '409':
          description: Capability, quote expiry/change, inventory, minimum-order, idempotency conflict, or reservation conflict
        '422': {description: Address ownership or delivery coverage conflict}

  /customer/orders:
    get:
      summary: List orders owned by the authenticated customer with cursor pagination
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - in: query
          name: before
          description: Opaque cursor returned in the previous page's meta.next_cursor.
          schema: {type: string, maxLength: 256}
        - in: query
          name: status
          schema: {type: string, enum: [placed, accepted, confirmed, preparing, ready_for_pickup, rejected, out_for_delivery, delivered, completed, cancelled, returned]}
        - in: query
          name: order_type
          schema: {type: string, enum: [food_delivery, table_reservation, hotel_booking, platform_order]}
      responses:
        '200': {description: Customer-owned orders and page metadata; failures return an error, never an empty list}
        '400': {description: Invalid filter, cursor, or limit}

  /customer/addresses:
    get:
      summary: List addresses owned by the authenticated customer
      tags: [customer]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Customer-owned addresses with default first}
        '403': {description: Customer role required}
    post:
      summary: Save a customer delivery address
      tags: [customer]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerAddressInput'}
      responses:
        '201': {description: Saved address}
        '400': {description: Address fields or optional coordinate pair are invalid}
        '403': {description: Customer role required}
  /customer/addresses/{id}:
    put:
      summary: Replace a customer-owned address and optionally make it default
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerAddressInput'}
      responses:
        '200': {description: Updated address}
        '400': {description: Address fields or optional coordinate pair are invalid}
        '404': {description: Address not found or not owned}
    delete:
      summary: Delete a customer-owned address
      description: Deleting a default address promotes the most recently updated remaining address. Existing order address snapshots are retained.
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Address deleted}
        '404': {description: Address not found or not owned}

  /orders/{id}:
    get:
      summary: Get an owned order or an order for an authorized merchant business
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Exact customer-owned order details with recorded status events}
        '404': {description: Order not found or not owned by the customer}

  /orders/{id}/support:
    post:
      summary: Submit or retrieve an idempotent customer support report for an owned order
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 1000}
      responses:
        '201': {description: Order-specific report was created or an existing open report was returned}
        '400': {description: Support reason is invalid}
        '404': {description: Order not found or not owned by the customer}

  /orders/{id}/cancel:
    post:
      summary: Cancel an eligible customer-owned order
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Cancelled order}
        '404': {description: Order not found or not owned by the customer}
        '409': {description: Order state cannot be cancelled}

  /orders/{id}/payment-intents:
    post:
      summary: Create an idempotent server-priced payment intent for an owned platform order
      description: Accepts no request body. Creates an immutable amount/currency snapshot only when the payment-intent feature gate is enabled. It does not create a gateway session, collect money, change order payment_status, or mark an order paid. The amount is read from the order; clients cannot supply or override it.
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201': {description: Payment intent snapshot created; provider session is unavailable in this phase}
        '200': {description: Original intent returned for an exact idempotent retry}
        '400': {description: Invalid order ID or idempotency key}
        '403': {description: Active customer role required}
        '404': {description: Order is not an eligible unpaid platform order owned by the caller}
        '409': {description: Conflicting idempotency key, existing intent, or unsupported order amount}
        '503': {description: Payment intent creation is disabled}
  /orders/{id}/payment-intent:
    get:
      summary: Read the payment-intent snapshot for an owned platform order
      description: Returns the server-priced intent snapshot. Payment remains not_collected until a future approved provider verification flow updates it.
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Owned payment intent; provider session unavailable in this phase}
        '400': {description: Invalid order ID}
        '403': {description: Active customer role required}
        '404': {description: Order or payment intent not found for this customer}

  /orders/{id}/payment-sessions:
    post:
      summary: Create or replay a sandbox payment session for an owned payment intent
      description: Sandbox-only server-created session. The API ignores client pricing, requires the sandbox feature gates, and never activates live UPI or collects real funds. A session is not proof of payment.
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201': {description: Sandbox session created; order remains unpaid until a verified provider event}
        '200': {description: Existing sandbox attempt returned for an exact retry}
        '403': {description: Active customer role required}
        '404': {description: Owned payment intent not found}
        '409': {description: Order is ineligible or another payment attempt is active}
        '503': {description: Sandbox provider or feature gate is disabled}

  /orders/{id}/payment:
    get:
      summary: Read authoritative payment, attempt and refund summary for an owned order
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Server-authoritative payment projection and refund history; sandbox is explicitly identified}
        '403': {description: Active customer role required}
        '404': {description: Order not found for this customer}

  /orders/{id}/refunds:
    get:
      summary: Read refund requests for an owned order
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Refund status and history; verified sandbox results only}
        '404': {description: Order not found for this customer}
    post:
      summary: Request a sandbox refund against a verified paid platform order
      description: Creates a finance-review request only. It does not promise eligibility or bank credit and cannot refund more than the remaining verified capture balance.
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, reason_code]
              properties:
                amount_minor: {type: integer, format: int64, minimum: 1}
                reason_code: {type: string, enum: [order_cancelled, items_missing, items_damaged, duplicate_payment, other]}
      responses:
        '201': {description: Refund request recorded as requested and awaiting finance review}
        '200': {description: Exact idempotent refund replay}
        '404': {description: Order not found for this customer}
        '409': {description: Unpaid/ineligible order, conflicting key, or amount exceeds remaining captured balance}

  /admin/payments/refunds/{id}/review:
    post:
      summary: Approve or reject a customer refund request
      description: Requires finance.post, a reason, and a different principal from the requester. Approval creates only a synthetic sandbox provider refund.
      tags: [admin]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [approve, reject]}
                reason: {type: string, minLength: 8, maxLength: 300}
      responses:
        '200': {description: Synthetic provider refund initiated}
        '204': {description: Refund request rejected}
        '202': {description: Approval recorded, provider response ambiguous and reconciliation required}
        '403': {description: Finance posting permission required}
        '409': {description: Refund is no longer reviewable}

  /admin/payments/refunds:
    get:
      summary: List Admin-visible refund requests
      tags: [admin]
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [requested, approved, processing, succeeded, failed, rejected, reconciliation_required], default: requested}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Refund queue with order references and stored refund providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        order_id: {type: string, format: uuid}
                        customer_user_id: {type: string, format: uuid}
                        reference_code: {type: string}
                        provider: {type: string}
                        amount_minor: {type: integer, format: int64}
                        currency: {type: string}
                        status: {type: string}
                        reason_code: {type: string}
                        created_at: {type: string, format: date-time}
        '403': {description: Active Platform Admin access required}

  /admin/payments/refunds/{id}/reconcile:
    post:
      summary: Reconcile a sandbox refund from server-fetched provider status
      tags: [admin]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Provider-fetched refund outcome reconciled}
        '403': {description: Active Platform Admin access required}
        '404': {description: Refund or provider reference not found}

  /orders/{id}/sandbox-payment-outcomes:
    post:
      summary: Apply a QA-only deterministic payment provider outcome
      description: Route exists only in QA/test deployments and requires the authenticated customer ID in PAYMENT_SANDBOX_QA_USER_IDS. It invokes server-side event processing and is absent from production routing.
      tags: [payments]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [pending, succeeded, failed, expired]}
      responses:
        '200': {description: QA provider event processed by the server}
        '404': {description: Simulation unavailable or order not found}

  /orders/{id}/refunds/{refundId}/sandbox-outcomes:
    post:
      summary: Apply a QA-only synthetic refund provider outcome
      tags: [payments]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: refundId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [pending, succeeded, failed]}
      responses:
        '200': {description: QA provider refund event processed by the server}
        '404': {description: Simulation unavailable or refund not found}

  /payments/webhooks/{provider}:
    post:
      summary: Receive a provider-authenticated payment event
      description: Accepts only allowlisted provider callbacks authenticated over the exact raw request body. The sandbox implementation uses HMAC-SHA256 with a signed timestamp and key ID; invalid signatures never mutate payment state. No raw payload or credential is stored.
      tags: [payments]
      parameters:
        - in: path
          name: provider
          required: true
          schema: {type: string, enum: [grepmind_sandbox]}
        - in: header
          name: X-Grepmind-Sandbox-Signature
          required: true
          description: "t=<unix-seconds>,kid=<key-id>,v1=<hex HMAC-SHA256 of `t + '.' + raw body>"
          schema: {type: string, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, event_id, provider_reference, status, amount_minor, currency, event_at]
              properties:
                object_type: {type: string, enum: [payment, refund], default: payment}
                provider: {type: string, enum: [grepmind_sandbox]}
                event_id: {type: string, minLength: 1, maxLength: 180}
                provider_reference: {type: string, minLength: 1, maxLength: 180}
                status: {type: string, enum: [pending, succeeded, failed, expired]}
                amount_minor: {type: integer, format: int64, minimum: 1}
                currency: {type: string, enum: [INR]}
                event_at: {type: string, format: date-time}
      responses:
        '200': {description: Verified event processed or exact duplicate safely acknowledged}
        '202': {description: Event quarantined or requires reconciliation}
        '400': {description: Invalid provider event}
        '401': {description: Signature, key ID, or timestamp verification failed}
        '409': {description: Provider event ID was replayed with different payload}
        '413': {description: Webhook body exceeds the configured limit}

  /admin/payments/reconciliation-queue:
    get:
      tags: [payments]
      summary: List payment attempts requiring reconciliation and recorded exceptions
      description: Read-only. Without view, preserves the legacy mixed queue. Explicit views return current attempts or immutable history, ordered by time and ID with cursor pagination.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: view, schema: {type: string, enum: [needs_action, history]}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 20}, description: Applies only with an explicit view.}
        - {in: query, name: before, schema: {type: string, maxLength: 128}, description: Cursor from the previous response for the same view and filters.}
        - {in: query, name: status, schema: {type: string, enum: [initialized, session_created, pending, succeeded, failed, expired, reconciliation_required]}, description: Current payment attempt status.}
        - {in: query, name: outcome, schema: {type: string, enum: [matched, missing_webhook, late_success, amount_mismatch, currency_mismatch, unknown_reference, provider_unavailable]}, description: History event outcome or the latest exception outcome on an outstanding attempt.}
        - {in: query, name: reference, schema: {type: string, maxLength: 64}, description: Exact order reference or UUID.}
        - {in: query, name: attempt_id, schema: {type: string, format: uuid}, description: Exact attempt relationship for linked history.}
        - {in: query, name: from, schema: {type: string, format: date}, description: Inclusive UTC start date.}
        - {in: query, name: to, schema: {type: string, format: date}, description: Inclusive UTC end date.}
      responses:
        '200':
          description: Bounded reconciliation queue
          content:
            application/json:
              schema:
                type: object
                required: [data, more_results]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [id, kind, order_id, reference_code, attempt_id, attempt_number, attempt_status, outcome, amount_minor, currency, recorded_at]
                      properties:
                        id: {type: string, format: uuid}
                        kind: {type: string, enum: [action_required, recorded_exception, recorded_event]}
                        order_id: {type: string, format: uuid}
                        reference_code: {type: string}
                        attempt_id: {type: string, format: uuid}
                        attempt_number: {type: integer}
                        attempt_status: {type: string}
                        outcome: {type: string, nullable: true}
                        amount_minor: {type: integer, format: int64}
                        currency: {type: string}
                        recorded_at: {type: string, format: date-time}
                  more_results: {type: boolean}
                  meta:
                    type: object
                    description: Present only with an explicit view.
                    required: [view, count, has_more]
                    properties:
                      view: {type: string, enum: [needs_action, history]}
                      count: {type: integer}
                      has_more: {type: boolean}
                      next_cursor: {type: string}
        '400':
          description: Invalid view, filter or cursor
        '401':
          description: Authentication required
        '403':
          description: Active Platform Admin access required
        '500':
          description: Queue data unavailable

  /admin/payments/orders/{reference}:
    get:
      tags: [payments]
      summary: Read payment tracking for an exact order reference or UUID
      description: Requires an active Platform Admin. Returns recorded order and sandbox payment states with bounded history. This lookup does not contact the provider or initiate reconciliation.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: reference
          required: true
          schema:
            type: string
            maxLength: 64
            pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,63}$'
      responses:
        '200':
          description: Order payment state and history
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [order, intent, attempts, reconciliation, refunds, more_attempts, more_refunds, more_reconciliation_events]
                    properties:
                      order:
                        type: object
                        required: [id, reference_code, status, payment_status, payment_method, amount_minor, currency]
                        properties:
                          id: {type: string, format: uuid}
                          reference_code: {type: string}
                          status: {type: string}
                          payment_status: {type: string}
                          payment_method: {type: string, nullable: true}
                          amount_minor: {type: integer, format: int64}
                          currency: {type: string}
                      intent:
                        type: object
                        nullable: true
                        required: [id, order_id, amount_minor, currency, status, created_at]
                        properties:
                          id: {type: string, format: uuid}
                          order_id: {type: string, format: uuid}
                          amount_minor: {type: integer, format: int64}
                          currency: {type: string}
                          status: {type: string}
                          created_at: {type: string, format: date-time}
                      attempts:
                        type: array
                        maxItems: 25
                        items:
                          type: object
                          required: [id, attempt_number, provider, status, amount_minor, currency, capture_posted, updated_at]
                          properties:
                            id: {type: string, format: uuid}
                            attempt_number: {type: integer}
                            provider: {type: string}
                            status: {type: string}
                            amount_minor: {type: integer, format: int64}
                            currency: {type: string}
                            updated_at: {type: string, format: date-time}
                            capture_posted: {type: boolean, description: Posted verified sandbox capture journal exists for this attempt}
                      refunds:
                        type: array
                        maxItems: 25
                        items:
                          type: object
                          required: [id, attempt_id, attempt_number, provider, status, amount_minor, currency, created_at]
                          properties:
                            id: {type: string, format: uuid}
                            attempt_id: {type: string, format: uuid}
                            attempt_number: {type: integer}
                            provider: {type: string}
                            status: {type: string}
                            amount_minor: {type: integer, format: int64}
                            currency: {type: string}
                            created_at: {type: string, format: date-time}
                      more_refunds: {type: boolean}
                      reconciliation:
                        type: array
                        maxItems: 50
                        items:
                          type: object
                          required: [id, attempt_id, attempt_number, outcome, provider_status, created_at]
                          properties:
                            id: {type: string, format: uuid}
                            attempt_id: {type: string, format: uuid}
                            attempt_number: {type: integer}
                            outcome: {type: string}
                            provider_status: {type: string, nullable: true}
                            created_at: {type: string, format: date-time}
                      more_attempts: {type: boolean}
                      more_reconciliation_events: {type: boolean}
        '400':
          description: Invalid order reference
        '401':
          description: Authentication required
        '403':
          description: Active Platform Admin access required
        '404':
          description: Order not found
        '500':
          description: Tracking data unavailable

  /admin/payments/attempts/{id}/reconcile:
    post:
      summary: Reconcile a sandbox attempt with server-fetched provider status
      description: Requires finance.read authorization and the sandbox feature gate. Client-supplied provider status is never accepted; this endpoint cannot enable live payment features.
      tags: [admin]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Server-fetched sandbox status and persisted reconciliation outcome}
        '403': {description: Finance reconciliation permission required}
        '404': {description: Attempt or provider reference not found}
        '503': {description: Sandbox provider or feature gate is disabled}

  /requests/{id}/cancel:
    post:
      summary: Cancel an eligible customer-owned service request and release its slot
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Request cancelled}
        '403': {description: Request is owned by another customer}
        '404': {description: Request not found}
        '409': {description: Request state cannot be cancelled; requested, accepted, and rescheduled states are cancellable}

  /merchant/orders/{id}/status:
    patch:
      summary: Update order status for an authorized business member
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [confirmed, preparing, out_for_delivery, delivered, completed, cancelled]}
      responses:
        '200': {description: Updated order}
        '403': {description: Not an authorized business member}
        '409': {description: Invalid status transition}

  /catalog/locations:
    get:
      tags: [catalog]
      summary: List configured Odisha districts and delivery localities
      responses:
        '200':
          description: District and locality IDs, with delivery rollout status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, localities]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        localities:
                          type: array
                          items:
                            type: object
                            required: [id, name, delivery_enabled]
                            properties:
                              id: {type: string, format: uuid}
                              name: {type: string}
                              delivery_enabled: {type: boolean}
  /platform/orders/quote:
    post:
      summary: Create a server-priced platform cart quote with one eligible partner
      description: The customer chooses platform products, a saved address, and a backend-enabled payment method. Grepmind selects one approved partner capable of fulfilling the complete cart. Quotes expire after five minutes and do not reserve stock. Payment method availability is returned by the backend; no payment is collected by quoting.
      tags: [customer]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformCheckoutQuoteRequest'}
      responses:
        '201': {description: Server-authoritative quote and selected partner; settlement costs are omitted}
        '400': {description: Invalid vertical, address, or cart}
        '403': {description: Customer role required}
        '409': {description: Product unavailable or no single eligible partner can fulfill the full cart}
        '422': {description: Address ownership or locality validation failed}
  /platform/orders:
    post:
      summary: Submit an idempotent Grepmind platform catalog order
      description: Requires an explicitly selected backend-eligible payment method, revalidates the quote and partner, reserves applicable stock atomically, stores immutable item and address snapshots, and leaves payment not_collected until verified UPI capture or eligible COD collection.
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformCheckoutSubmitRequest'}
      responses:
        '201': {description: Platform order created}
        '200': {description: Original order returned for an idempotent retry}
        '400': {description: Invalid quote or idempotency key}
        '403': {description: Customer role required}
        '404': {description: Quote not found for this customer}
        '409': {description: Quote expired, changed, consumed, or fulfillment unavailable}
