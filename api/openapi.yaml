openapi: 3.0.3
info:
  title: Grepmind Near API
  version: v1
  description: |
    Local discovery platform API for customers, merchants, professionals,
    and administrators. Base path: /api/v1
    Active business coverage is restricted to Cuttack and Jajpur.
  contact:
    name: Grepmind Near
    email: support@grepmind.local
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.grepmind.local/api/v1
    description: Staging
tags:
  - name: auth
    description: Phone OTP authentication and session management
  - name: me
    description: Authenticated user profile
  - name: discovery
    description: Categories, business search, nearby, business details
  - name: merchant
    description: Merchant business, products, offers, service requests
  - name: customer
    description: Customer service requests and favourites
  - name: admin
    description: Administrator moderation and operations
  - name: media
    description: Direct media uploads and MinIO S3 object storage
  - name: notifications
    description: Real-time SSE event streaming and persistent notification management
  - name: health
    description: Health checks

paths:
  /locations:
    get:
      tags: [discovery]
      summary: List supported cities from approved businesses
      responses:
        '200':
          description: Live city name, listing count, latitude and longitude in data array (maximum 200 cities).
        '500': {description: Unable to load cities}
  /merchant/catalog-categories:
    get:
      tags: [merchant]
      summary: List categories owned by the current merchant business
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: business_id
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Category list in data, each containing id and name
        '401': {description: Authentication required}
        '403': {description: Business membership required}
    post:
      tags: [merchant]
      summary: Create a merchant catalog category (owner or manager)
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: business_id
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201': {description: Created category in data with id and name}
        '400': {description: Invalid category}
        '401': {description: Authentication required}
        '403': {description: Owner or manager required}
        '409': {description: Duplicate category}
  /merchant/catalog-categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: business_id
        schema: {type: string, format: uuid}
    patch:
      tags: [merchant]
      summary: Rename an owned catalog category
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200': {description: Updated category in data with id and name}
        '400': {description: Invalid category}
        '401': {description: Authentication required}
        '403': {description: Owner or manager required}
        '409': {description: Category conflict}
    delete:
      tags: [merchant]
      summary: Delete an owned catalog category without deleting catalog items
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Category deleted}
        '401': {description: Authentication required}
        '403': {description: Owner or manager required}
        '404': {description: Category not found}
  /media/upload:
    post:
      summary: Upload an image asset to MinIO S3 object storage
      tags: [media]
      description: |
        Accepts multipart/form-data with image payload (JPEG, PNG, WebP) up to 10MB.
        Returns the asset URL served through Nginx proxy and MinIO metadata.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file to upload
                purpose:
                  type: string
                  enum: [storefront, product, service, kyc, avatar, general]
                  default: general
                  description: Organizational bucket prefix
      responses:
        '201':
          description: Media uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      purpose:
                        type: string
                      object_key:
                        type: string
                      url:
                        type: string
                        example: "/media/storefront/20261029_abc123.jpg"
                      public_url:
                        type: string
                        example: "http://localhost/media/storefront/20261029_abc123.jpg"
                      content_type:
                        type: string
                        example: "image/jpeg"
                      size_bytes:
                        type: integer
                      original_name:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Invalid file format or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /media:
    get:
      summary: List uploaded media assets
      tags: [media]
      parameters:
        - name: purpose
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of media uploads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /events:
    get:
      summary: Stream real-time booking updates and platform events (Server-Sent Events)
      tags: [notifications]
      description: |
        Establishes an HTTP long-lived text/event-stream connection.
        Subscribers receive real-time push events for service booking creation,
        status transitions, and merchant/customer alerts. Heartbeat pings sent every 15s.
      parameters:
        - name: business_id
          in: query
          required: false
          schema:
            type: string
          description: Filter events strictly for this business
        - name: request_id
          in: query
          required: false
          schema:
            type: string
          description: Filter events for a single booking tracking lifecycle
      responses:
        '200':
          description: Active event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: service_request.created\ndata: {\"event\":\"service_request.created\",\"title\":\"New Booking Request!\"}\n\n"

  /notifications:
    get:
      summary: Fetch persistent notifications list
      tags: [notifications]
      parameters:
        - name: business_id
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of persistent notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        body:
                          type: string
                        event_type:
                          type: string
                        is_read:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time

  /notifications/{id}/read:
    post:
      summary: Mark a notification as read
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: notification marked as read

  /notifications/broadcast-test:
    post:
      summary: Trigger synthetic test notification broadcast
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id, title]
              properties:
                business_id:
                  type: string
                title:
                  type: string
                body:
                  type: string
                event_type:
                  type: string
      responses:
        '200':
          description: Test event dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /healthz:
    get:
      summary: Health check
      tags: [health]
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ---------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------
  /auth/otp/request:
    post:
      summary: Request a phone OTP
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164]
              properties:
                phone_e164:
                  type: string
                  example: "+919876543210"
                  description: E.164 formatted phone number
      responses:
        '202':
          description: >-
            OTP sent. Local development mode may include otp_code to support
            emulator testing; non-local environments never return the code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/otp/verify:
    post:
      summary: Verify OTP and establish a session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164, otp_code]
              properties:
                phone_e164:
                  type: string
                  example: "+919876543210"
                otp_code:
                  type: string
                  example: "123456"
                idempotency_key:
                  type: string
                  example: "otp-verify-unique-key"
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Rotate refresh credentials
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Revoke the current session
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  # ---------------------------------------------------------------
  # Me (authenticated user)
  # ---------------------------------------------------------------
  /me:
    get:
      summary: Get the authenticated user
      tags: [me]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
    patch:
      summary: Update allowed profile fields
      tags: [me]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                preferred_language:
                  type: string
                  example: "en"
                avatar_url:
                  type: string
                  nullable: true
                  pattern: '^/media/avatar/'
                notification_preferences:
                  type: object
                  additionalProperties: false
                  required: [booking_updates, offers, service_updates]
                  properties:
                    booking_updates: {type: boolean}
                    offers: {type: boolean}
                    service_updates: {type: boolean}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'

  # ---------------------------------------------------------------
  # Discovery
  # ---------------------------------------------------------------
  /categories:
    get:
      summary: Get active categories
      tags: [discovery]
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /businesses:
    get:
      summary: Search businesses by query and filters
      tags: [discovery]
      parameters:
        - in: query
          name: city
          description: Case-insensitive exact city filter, combined with category and optional radius.
          schema: {type: string, maxLength: 120}
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
        - $ref: '#/components/parameters/RadiusM'
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/OpenNow'
        - $ref: '#/components/parameters/AvailableNow'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated business results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /businesses/{id}:
    get:
      summary: Get a business profile
      tags: [discovery]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: Business detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BusinessDetail'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Business not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}/products:
    get:
      summary: List published products
      tags: [discovery]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /businesses/{id}/services:
    get:
      summary: List active services
      tags: [discovery]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /businesses/{id}/offers:
    get:
      summary: List current published offers
      tags: [discovery]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: List of offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /offers:
    get:
      summary: List currently active offers for a supported city
      description: Returns offers only when published, within their active date interval, and attached to an approved business in Cuttack or Jajpur.
      tags: [discovery]
      parameters:
        - in: query
          name: city
          required: true
          schema: {type: string, enum: [Cuttack, Jajpur]}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current offers, with approved public business context
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CityOffer'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Unsupported or missing city

  /nearby:
    get:
      summary: Nearby discovery endpoint
      tags: [discovery]
      parameters:
        - in: query
          name: city
          description: Exact selected-city filter. Only active supported-city listings are returned.
          schema: {type: string, maxLength: 120}
        - $ref: '#/components/parameters/CategorySlug'
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
        - $ref: '#/components/parameters/RadiusM'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Nearby businesses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
                  meta:
                    $ref: '#/components/schemas/Meta'

  # ---------------------------------------------------------------
  # Favourites
  # ---------------------------------------------------------------
  /favorites:
    get:
      summary: List saved businesses
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Favourited businesses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /favorites/{businessId}:
    put:
      summary: Save a business
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200':
          description: Business saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Business not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove a saved business
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200':
          description: Business unsaved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  # ---------------------------------------------------------------
  # Merchant
  # ---------------------------------------------------------------
  /merchant/claimable-businesses:
    get:
      summary: Search approved Cuttack and Jajpur listings available for claim review
      tags: [merchant]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: Public listing fields for matching businesses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, category_slug, category, locality, city]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        category_slug: { type: string }
                        category: { type: string }
                        locality: { type: string }
                        city: { type: string }
                        image_url: { type: string }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /merchant/businesses/{id}/claim:
    post:
      summary: Submit an ownership claim for administrator review
      description: Claim submission never transfers ownership. Only an administrator decision can change the owner and business membership.
      tags: [merchant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201':
          description: Claim request persisted as pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Listing is not claimable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another claim request is already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Claim submission rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /merchant/business-claims:
    get:
      summary: List claim requests belonging to the authenticated merchant
      tags: [merchant]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user's own claim history only
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, business_id, business_name, status, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        business_id: { type: string, format: uuid }
                        business_name: { type: string }
                        city: { type: string }
                        status: { type: string, enum: [pending, approved, rejected] }
                        created_at: { type: string, format: date-time }
                        reviewed_at: { type: string, format: date-time }
                  meta:
                    $ref: '#/components/schemas/Meta'

  /merchant/businesses:
    get:
      summary: List businesses the user manages
      tags: [merchant]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Managed businesses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      summary: Create a business listing
      tags: [merchant]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
      responses:
        '201':
          description: Business created (draft)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Business'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /merchant/businesses/{id}:
    patch:
      summary: Update an authorized business
      tags: [merchant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessRequest'
      responses:
        '200':
          description: Business updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Business'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Business not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /merchant/businesses/{id}/submit:
    post:
      summary: Submit for approval
      tags: [merchant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200':
          description: Submitted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /merchant/businesses/{id}/members:
    get:
      summary: List team members and staff
