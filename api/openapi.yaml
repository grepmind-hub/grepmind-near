                    $ref: '#/components/schemas/Meta'
    delete:
      summary: Delete an offer owned by the authenticated merchant
      tags: [merchant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OfferIdPath'
      responses:
        '200': {description: Offer deleted}
        '403': {description: Business ownership or membership required}
        '404': {description: Offer not found}

  /merchant/requests:
    get:
      summary: List incoming service requests
      tags: [merchant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Service requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRequest'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /merchant/businesses/{businessId}/platform-orders:
    get:
      summary: List Grepmind platform orders assigned to an authorized merchant business
      description: Returns only platform_catalog orders assigned to this business. Customer address, phone, and customer selling prices are not exposed. Active owners, managers, and staff may view assigned fulfillment tasks.
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {type: string, enum: [placed, accepted, preparing, ready_for_pickup, rejected, cancelled]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 30}
      responses:
        '200': {description: Assigned platform fulfillment orders}
        '401': {description: Authentication required}
        '403': {description: Active merchant business membership required}
  /merchant/businesses/{businessId}/platform-orders/{orderId}:
    get:
      summary: Read an assigned platform order's fulfillment details
      description: Exposes product snapshots, quantities, delivery locality, customer instructions, and status history. It omits customer contact/address details, customer prices, and partner settlement costs.
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Assigned platform order detail}
        '403': {description: Active merchant business membership required}
        '404': {description: Order is not assigned to this business}
  /merchant/businesses/{businessId}/platform-orders/{orderId}/accept:
    post:
      summary: Accept an assigned platform order
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Order accepted; duplicate acceptance is idempotent}
        '403': {description: Merchant membership required}
        '404': {description: Order not assigned to this business}
        '409': {description: Invalid or competing transition}
  /merchant/businesses/{businessId}/platform-orders/{orderId}/reject:
    post:
      summary: Reject an assigned platform order with a recorded reason
      description: Rejection is permitted only while awaiting acceptance. It releases reserved partner inventory once and does not automatically reassign, cancel, or refund the unpaid order.
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        '200': {description: Order rejected; reason recorded and reserved stock released}
        '400': {description: Rejection reason is invalid}
        '403': {description: Merchant membership required}
        '404': {description: Order not assigned to this business}
        '409': {description: Order is no longer awaiting partner response}
  /merchant/businesses/{businessId}/platform-orders/{orderId}/prepare:
    post:
      summary: Start preparation for an accepted platform order
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Order moved to preparing}
        '403': {description: Merchant membership required}
        '404': {description: Order not assigned to this business}
        '409': {description: Invalid state transition}
  /merchant/businesses/{businessId}/platform-orders/{orderId}/ready:
    post:
      summary: Mark a prepared platform order ready for pickup
      description: This does not mark the order as picked up or delivered.
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: orderId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Order is ready for pickup}
        '403': {description: Merchant membership required}
        '404': {description: Order not assigned to this business}
        '409': {description: Invalid state transition}

  /merchant/requests/{id}/status:
    patch:
      summary: Move a merchant service request through its allowed state machine
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - in: query
          name: business_id
          schema: {type: string, format: uuid}
          description: Required when the merchant has multiple businesses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [accepted, declined, in_progress, completed, cancelled]
      responses:
        '200': {description: Request state updated; cancelled or declined requests release slot capacity}
        '400': {description: Unsupported status; rescheduling requires a replacement slot}
        '404': {description: Request or business not found}
        '409': {description: Transition is not permitted from the current state}

  /merchant/businesses/{bizId}/requests/{id}/reschedule:
    patch:
      summary: Atomically move an accepted request to another appointment slot
      description: Reserves the replacement slot, releases the prior reservation, records a rescheduled state, and notifies the customer. The customer must confirm the proposed time before the request returns to accepted.
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: bizId
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RescheduleServiceRequestRequest'}
      responses:
        '200': {description: Replacement appointment reserved and awaiting customer confirmation}
        '400': {description: Invalid request or replacement slot ID}
        '404': {description: Business, request, or replacement slot not found in this business}
        '409': {description: Request state is invalid or replacement slot is unavailable}

  /requests/{id}/confirm-reschedule:
    post:
      summary: Confirm a merchant-proposed replacement appointment time
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200': {description: Proposed appointment confirmed and request returned to accepted}
        '403': {description: Request is owned by another customer}
        '404': {description: Request not found}
        '409': {description: No proposed appointment time is awaiting confirmation}

  /merchant/requests/{id}/accept:
    post:
      summary: Accept a service request
      tags: [merchant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '409':
          description: Request cannot be accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /merchant/requests/{id}/decline:
    post:
      summary: Decline a service request
      tags: [merchant]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Not available at requested time"
      responses:
        '200':
          description: Request declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /merchant/analytics/summary:
    get:
      summary: Merchant listing, enquiry and customer view metrics
      tags: [merchant]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Merchant metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      profile_complete:
                        type: boolean
                      listing_approved:
                        type: boolean
                      active_offers:
                        type: integer
                      incoming_requests:
                        type: integer
                      total_views:
                        type: integer
                        description: Combined unique profile and product catalog views over the last 30 UTC dates.
                      profile_views_30d:
                        type: integer
                      product_catalog_views_30d:
                        type: integer
                      views_period_days:
                        type: integer
                        enum: [30]
                  meta:
                    $ref: '#/components/schemas/Meta'

  /analytics/businesses/{id}/views:
    post:
      summary: Record a signed-in customer's business profile or product catalog view
      description: Counts a customer once per business, view type and UTC date. Viewer identity is stored as a keyed pseudonymous fingerprint and is never returned to merchants.
      tags: [discovery]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view_type]
              properties:
                view_type:
                  type: string
                  enum: [profile, catalog]
      responses:
        '204': {description: View recorded or already counted for this customer today}
        '400': {description: Invalid view event}
        '401': {description: Authentication required}
        '403': {description: A customer account is required; own business views are excluded}
        '404': {description: Public business or product catalog not found}

  # ---------------------------------------------------------------
  # Customer service requests
  # ---------------------------------------------------------------
  /service-requests:
    get:
      summary: List the customer's requests
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Customer service requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRequest'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      summary: Submit a service request
      tags: [customer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequestRequest'
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceRequest'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '409':
          description: Request conflict (capacity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /service-requests/{id}:
    get:
      summary: Get request details
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceRequest'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '403':
          description: Not your request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /service-requests/{id}/cancel:
    post:
      summary: Cancel an eligible request
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  # ---------------------------------------------------------------
  # Administration
  # ---------------------------------------------------------------
  /admin/stats:
    get:
      summary: Database-backed operational counts
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: city
          schema:
            type: string
            enum: [Cuttack, Jajpur]
          description: Optional market city filter.
        - in: query
          name: range
          schema:
            type: string
            enum: [7d, 14d, 30d]
            default: 14d
          description: Time window for service request and order counts.
      responses:
        '200':
          description: Operational statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminStats'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /admin/trends:
    get:
      summary: Daily operational trend series and category mix
      description: Date buckets use Asia/Kolkata and are sourced from businesses, service_requests, customer_orders, and categories.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: city
          schema: { type: string, enum: [Cuttack, Jajpur] }
        - in: query
          name: range
          schema: { type: string, enum: [7d, 14d, 30d], default: 14d }
      responses:
        '200':
          description: Database-backed daily trends and listing category volumes

  /admin/listing-activity:
    get:
      summary: List recorded business creation events by authenticated account
      description: Only registrations with an explicit create_business audit event are returned; legacy owners are not assumed to be creators.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: city
          schema: { type: string, enum: [Cuttack, Jajpur] }
        - in: query
          name: range
          schema: { type: string, enum: [7d, 14d, 30d], default: 30d }
      responses:
        '200':
          description: Listing creation events with actor ID, phone, listing, city and timestamp

  /admin/user-access:
    get:
      summary: List searchable user accounts and current roles
      description: Returns at most 200 records; meta.can_manage_roles is true only for the protected primary superadmin.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: User access records and role management capability
        '403':
          description: Administrator privilege required
    post:
      summary: Create or replace a user's platform roles
      description: Restricted to the primary superadmin. Assigning the rider role is the approval gate for Rider Mode; it does not provision dispatch or tracking. Existing sessions are revoked atomically with role changes; the primary superadmin account is protected.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164, roles]
              properties:
                phone_e164: { type: string, pattern: '^\\+91[6-9][0-9]{9}$' }
                display_name: { type: string, maxLength: 120 }
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [admin, merchant, customer, professional, rider, delivery_operator] }
      responses:
        '200':
          description: Account roles replaced and sessions revoked
        '400':
          description: Invalid phone number or role set
        '403':
          description: Primary superadmin access required

  /admin/businesses:
    get:
      summary: List businesses across moderation states
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Businesses list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /admin/business-claims:
    get:
      summary: List pending ownership claims for administrator review
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending claim requests with claimant statement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, business_id, business_name, claimant_id, claimant_phone, message, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        business_id: { type: string, format: uuid }
                        business_name: { type: string }
                        claimant_id: { type: string, format: uuid }
                        claimant_name: { type: string }
                        claimant_phone: { type: string }
                        message: { type: string }
                        created_at: { type: string, format: date-time }
        '403':
          description: Administrator privilege required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/business-claims/{id}/decision:
    post:
      summary: Approve or reject a pending ownership claim
      description: Approval atomically transfers owner_user_id, revokes the prior owner's membership, assigns the claimant as owner, and records an audit event.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string, minLength: 5, maxLength: 1000, description: Approval requires at least 10 characters of reviewed evidence. }
      responses:
        '200':
          description: Claim decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '403':
          description: Administrator privilege required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Claim has already been reviewed or listing is no longer eligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/businesses/pending:
    get:
      summary: Review pending listings
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending businesses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /admin/businesses/{id}/approve:
