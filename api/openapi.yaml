  /businesses/{id}/cart/validate:
    post:
      summary: Validate a customer's cart against current prices and inventory
      description: Read-only validation for approved restaurant and cafe businesses with delivery_enabled. Order creation rechecks stock atomically.
      tags: [commerce]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 50}
      responses:
        '200':
          description: Current availability, server prices and minimum-order status in integer minor units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidationResponse'
        '401': {description: Authentication required}
        '403': {description: Customer role required}
        '404': {description: Approved business not found}
        '409': {description: Business does not support product ordering}

  /businesses/{id}/orders/quote:
    post:
      summary: Create an expiring server-priced checkout quote
      description: Does not reserve stock. Revalidates merchant hours, coverage, address ownership, item prices, inventory, minimum order and delivery fee. Taxes are reported as not configured until a reviewed server tax policy is available.
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCheckoutQuoteRequest'}
      responses:
        '201': {description: Five-minute quote; stock remains unreserved}
        '400': {description: Invalid fulfillment, address, products, or quantities}
        '403': {description: Customer role required}
        '409': {description: Ordering unavailable, merchant closed, insufficient stock, or minimum not met}
        '422': {description: Invalid address or delivery coverage conflict}

