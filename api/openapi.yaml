              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CityCatalogItem'}
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Unsupported city or invalid filter/pagination

