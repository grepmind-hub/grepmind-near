  /catalog/new-arrivals:
    get:
      summary: List recently published products and services in a supported city
      description: Returns only published products and active services belonging to approved Cuttack or Jajpur businesses. Drafts, inactive services and out-of-stock products are excluded. Items are ordered by publish or activation time.
      tags: [discovery]
      parameters:
        - in: query
          name: city
          required: true
          schema: {type: string, enum: [Cuttack, Jajpur]}
        - in: query
          name: type
          schema: {type: string, enum: [all, products, services], default: all}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 8}
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: Catalog items with pagination metadata
          content:
