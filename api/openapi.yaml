      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAvailabilitySlotRequest'}
      responses:
        '201': {description: Slot created}
        '400': {description: Invalid date, time, or capacity}
        '404': {description: Business not found or membership unavailable}
        '409': {description: Closed date, outside opening hours, past date, or overlapping slot}
  /merchant/businesses/{id}/availability-slots/{slotId}:
    patch:
      summary: Edit or close a future unbooked appointment slot
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - in: path
          name: slotId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAvailabilitySlotRequest'}
      responses:
        '200': {description: Slot updated}
        '400': {description: Invalid update}
        '404': {description: Business or slot not found in this business}
        '409': {description: Slot is booked, past, closed by exception, or overlapping}
  /merchant/businesses/{id}/availability-exceptions:
    put:
      summary: Upsert date-specific closure or local opening hours
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AvailabilityExceptionRequest'}
      responses:
        '200': {description: Date exception saved; unbooked slots close atomically for closed dates}
        '400': {description: Invalid date, custom hours, or note}
        '404': {description: Business not found or membership unavailable}
        '409': {description: Date contains booked appointments and cannot be closed}

  /businesses/{id}/orders:
    post:
      summary: Create a food order, table reservation, or hotel booking
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCustomerOrderRequest'}
      responses:
        '201':
          description: Persisted order with server-calculated totals
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StandardResponse'}
        '409':
          description: Business capability, inventory, minimum-order, or reservation conflict

  /customer/orders:
    get:
      summary: List orders owned by the authenticated customer
      tags: [customer]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Customer orders}

  /orders/{id}:
    get:
      summary: Get an owned order or an order for an authorized merchant business
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Order details}
        '404': {description: Order not found or not owned by the customer}

  /orders/{id}/cancel:
    post:
      summary: Cancel an eligible customer-owned order
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Cancelled order}
        '404': {description: Order not found or not owned by the customer}
        '409': {description: Order state cannot be cancelled}

  /requests/{id}/cancel:
    post:
      summary: Cancel an eligible customer-owned service request and release its slot
      tags: [customer]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Request cancelled}
        '403': {description: Request is owned by another customer}
        '404': {description: Request not found}
        '409': {description: Request state cannot be cancelled}

  /merchant/orders/{id}/status:
    patch:
      summary: Update order status for an authorized business member
      tags: [merchant]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [confirmed, preparing, out_for_delivery, delivered, completed, cancelled]}
      responses:
        '200': {description: Updated order}
        '403': {description: Not an authorized business member}
        '409': {description: Invalid status transition}

# ---------------------------------------------------------------
# Components
# ---------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/otp/verify

  parameters:
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Search query (shop name, category, product, service)
    Lat:
      name: lat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      example: 20.46
      description: Latitude
    Lng:
      name: lng
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      example: 85.88
      description: Longitude
    RadiusM:
      name: radius_m
      in: query
      schema:
        type: integer
        minimum: 100
        maximum: 50000
        default: 5000
      example: 5000
      description: Search radius in metres
    CategorySlug:
      name: category_slug
      in: query
      schema:
        type: string
      example: "hardware"
    OpenNow:
      name: open_now
      in: query
      schema:
        type: boolean
      description: Filter to currently open businesses
    AvailableNow:
      name: available_now
      in: query
      schema:
        type: boolean
      description: Filter to professionals accepting requests now
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [relevance, distance, recent]
        default: relevance
      description: Sort by query relevance, proximity, or newest approved listing.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Cursor for pagination
    Lang:
      name: lang
      in: query
      schema:
        type: string
        default: "en"
      description: Preferred language
    BusinessId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Business ID
    BusinessIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Status:
      name: status
      in: query
      schema:
        type: string
      description: Filter by status

  schemas:
    AvailabilitySlot:
      type: object
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        local_date: {type: string, format: date}
        local_starts_at: {type: string, example: '10:00'}
        local_ends_at: {type: string, example: '11:00'}
        capacity: {type: integer, minimum: 1}
        booked_count: {type: integer, minimum: 0}
        remaining_capacity: {type: integer, minimum: 0}
        status: {type: string, enum: [open, closed]}
        time_zone: {type: string, example: Asia/Kolkata}
    AvailabilityException:
      type: object
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        is_closed: {type: boolean}
        opens_at: {type: string, nullable: true, example: '10:00'}
        closes_at: {type: string, nullable: true, example: '15:00'}
        note: {type: string, maxLength: 240}
    CreateAvailabilitySlotRequest:
      type: object
      required: [date, starts_at, ends_at, capacity]
      properties:
        date: {type: string, format: date}
        starts_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '10:00'}
        ends_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '11:00'}
        capacity: {type: integer, minimum: 1, maximum: 20}
    UpdateAvailabilitySlotRequest:
      type: object
      properties:
        date: {type: string, format: date}
        starts_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        ends_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        capacity: {type: integer, minimum: 1, maximum: 20}
        status: {type: string, enum: [open, closed]}
    AvailabilityExceptionRequest:
      type: object
      required: [date, is_closed]
      properties:
        date: {type: string, format: date}
        is_closed: {type: boolean}
        opens_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        closes_at: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        note: {type: string, maxLength: 240}

    CreateCustomerOrderRequest:
      type: object
      required: [order_type]
      properties:
        order_type: {type: string, enum: [food_delivery, table_reservation, hotel_booking]}
        fulfillment_type: {type: string, enum: [delivery, takeaway]}
        delivery_address: {type: string, maxLength: 500}
        notes: {type: string, maxLength: 1000}
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1, maximum: 99}
        reservation_at: {type: string, format: date-time}
        reservation_end_at: {type: string, format: date-time}
        guest_count: {type: integer, minimum: 1, maximum: 30}
        seating_area: {type: string, maxLength: 80}
        room_product_id: {type: string, format: uuid}

    Meta:
      type: object
      properties:
        request_id:
          type: string
          example: "req_abc123"

    StandardResponse:
      type: object
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/Meta'

    BusinessMember:
      type: object
      required: [id, business_id, user_id, phone_e164, role, status]
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        phone_e164:
          type: string
          example: "+919861000005"
        role:
          type: string
          enum: [owner, manager, staff]
        status:
          type: string
          enum: [active, suspended, revoked]
        created_at:
          type: string
          format: date-time

    AddBusinessMemberRequest:
      type: object
      required: [phone_e164, role]
      properties:
        phone_e164:
          type: string
          example: "+919861000005"
        role:
          type: string
          enum: [manager, staff]
        display_name:
          type: string
          example: "Rakesh Mohapatra"

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: "The request contains invalid fields."
            details:
              type: object
              description: Field-specific validation errors
            request_id:
              type: string
              example: "req_abc123"

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone_e164:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        status:
          type: string
        preferred_language:
          type: string
        notification_preferences:
          type: object
          properties:
            booking_updates: {type: boolean}
            offers: {type: boolean}
            service_updates: {type: boolean}
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        icon_name:
          type: string
        description:
          type: string

    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        category_slug:
          type: string
        category_name:
          type: string
        address_text:
          type: string
        city:
          type: string
        distance_m:
          type: integer
        status:
          type: string
        verification_status:
          type: string
        phone_e164:
          type: string
        whatsapp_e164:
          type: string
        is_open_now:
          type: boolean
        accepts_requests:
          type: boolean
        cover_photo_url:
          type: string
        created_at:
          type: string
          format: date-time

    BusinessDetail:
      allOf:
        - $ref: '#/components/schemas/Business'
        - type: object
          properties:
            description:
              type: string
            postal_code:
              type: string
            location:
              type: object
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
            business_hours:
              type: array
              items:
                $ref: '#/components/schemas/BusinessHour'
            products:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            offers:
              type: array
              items:
                $ref: '#/components/schemas/Offer'
            services:
              type: array
              items:
                $ref: '#/components/schemas/Service'
            media:
              type: array
              items:
                $ref: '#/components/schemas/BusinessMedia'
            service_radius_m:
              type: integer
            experience_years:
              type: integer
            service_description:
              type: string
            next_available_appointment:
              type: string
              format: date-time
              nullable: true

    BusinessHour:
      type: object
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type: string
          nullable: true
        closes_at:
          type: string
          nullable: true
        is_closed:
          type: boolean

    CreateBusinessRequest:
      type: object
      required: [name, category_slug, address_text, locality, city, postal_code, latitude, longitude, hours]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        category_slug:
          type: string
        phone_e164:
          type: string
        whatsapp_e164:
          type: string
        address_text:
          type: string
        locality:
          type: string
        city:
          type: string
        postal_code:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        cover_photo_url:
          type: string
          description: Relative URL returned by an owned storefront media upload.
        hours:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/BusinessHourInput'

    UpdateBusinessRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category_slug:
          type: string
        phone_e164:
          type: string
        whatsapp_e164:
          type: string
        address_text:
          type: string
        locality:
          type: string
        city:
          type: string
        postal_code:
          type: string

    BusinessHourInput:
      type: object
      required: [weekday]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        opens_at:
          type: string
          nullable: true
        closes_at:
          type: string
          nullable: true
        is_closed:
          type: boolean

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string
        stock_status:
          type: string
        is_published:
          type: boolean
        image_url:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: double
        currency:
          type: string
          default: INR
        stock_status:
          type: string
          enum: [unknown, in_stock, out_of_stock, limited]
          default: unknown
        image_url:
          type: string
          nullable: true
        is_published:
          type: boolean
          default: false

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string
        stock_status:
          type: string
          enum: [unknown, in_stock, out_of_stock, limited]
        is_published:
          type: boolean
        image_url:
          type: string
          nullable: true

    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        indicative_price_min:
          type: number
          format: double
          nullable: true
        indicative_price_max:
          type: number
          format: double
          nullable: true
        currency:
          type: string
        is_active:
          type: boolean

    Offer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        business_name:
          type: string
          description: Present on administrator offer-list responses.
        title:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
        image_url:
          type: string
          nullable: true
        terms:
          type: string
          nullable: true
        discount_percent:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    CityOffer:
      allOf:
        - $ref: '#/components/schemas/Offer'
        - type: object
          required: [business_name, business_city]
          properties:
            business_name: {type: string}
            business_city: {type: string, enum: [Cuttack, Jajpur]}
            business_locality: {type: string}
            business_photo_url: {type: string}

    CreateOfferRequest:
      type: object
      required: [title, starts_at, ends_at]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        terms:
          type: string
          maxLength: 1000
        discount_percent:
          type: integer
          minimum: 0
          maximum: 100
        image_url:
          type: string
          nullable: true

    UpdateOfferRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        terms:
          type: string
        discount_percent:
          type: integer
          nullable: true

    CreateServiceRequestRequest:
      type: object
      required: [business_id, description]
      properties:
        business_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
          nullable: true
        slot_id:
          type: string
          format: uuid
          nullable: true
          description: Required whenever requested_for is supplied; the slot determines the authoritative scheduled time.
        description:
          type: string
          minLength: 5
          maxLength: 1000
        requested_for:
          type: string
          format: date-time
          description: Scheduled time; the server derives the stored value from slot_id and rejects time-only scheduling.
          nullable: true

    ServiceRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_user_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
          nullable: true
        slot_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        requested_for:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporter_user_id:
          type: string
          format: uuid
          nullable: true
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    BusinessMedia:
      type: object
      properties:
        id:
          type: string
          format: uuid
        object_key:
          type: string
        media_type:
          type: string
        sort_order:
          type: integer
        url:
          type: string
          nullable: true

    AdminStats:
      type: object
      properties:
        pending_verifications:
          type: integer
          example: 3
        reported_listings:
          type: integer
          example: 1
        pending_offers:
          type: integer
          example: 2
        active_listings:
          type: integer
          example: 12
        pending_claims:
          type: integer
        service_requests:
          type: integer
        customer_orders:
          type: integer
        active_accounts:
          type: integer
        notification_events:
          type: integer
