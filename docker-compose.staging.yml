# Grepmind Near — Docker Compose Staging
# Used for staging environment deployment

version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: grepmind_staging_postgres
    environment:
      POSTGRES_USER: grepmind_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: grepmind_near_staging
      PGDATA: /var/lib/postgresql/data
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - grepmind_staging
    restart: unless-stopped

  minio:
    image: elestio/minio:latest
    container_name: grepmind_staging_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - grepmind_staging
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grepmind_staging_api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: grepmind_staging
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: grepmind_near_staging
      DATABASE_URL: postgres://grepmind_staging:${POSTGRES_PASSWORD}@postgres:5432/grepmind_near_staging?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      OTP_PROVIDER: ${OTP_PROVIDER:-stub}
      OTP_TWILIO_SID: ${TWILIO_ACCOUNT_SID}
      OTP_TWILIO_TOKEN: ${TWILIO_AUTH_TOKEN}
      OTP_TWILIO_FROM: ${TWILIO_FROM_NUMBER}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: grepmind-near-staging
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_SSL: "false"
      FCM_PROJECT_ID: ${FCM_PROJECT_ID}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL}
    ports:
      - "8080:8080"
    networks:
      - grepmind_staging
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: grepmind_staging_nginx
    depends_on:
      - api
    volumes:
      - ./infrastructure/docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - grepmind_staging
    restart: unless-stopped

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: grepmind_staging_admin_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_APP_NAME: Grepmind Near Admin (Staging)
    ports:
      - "3000:3000"
    networks:
      - grepmind_staging
    restart: unless-stopped

  merchant-web:
    build:
      context: ./apps/merchant-web
      dockerfile: Dockerfile
    container_name: grepmind_staging_merchant_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_APP_NAME: Grepmind Near Merchant (Staging)
    ports:
      - "3001:3000"
    networks:
      - grepmind_staging
    restart: unless-stopped

networks:
  grepmind_staging:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
